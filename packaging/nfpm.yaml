# The mill package, for nfpm. `make package` builds one rpm per
# architecture from the staging tree under dist/stage, one architecture at
# a time, and sets the two variables below; nothing here is run by hand.
# What goes where:
#
#   /usr/bin/mill                       the binary
#   /usr/lib/mill/sidecar/              the harness sidecar: dist/main.js and
#                                       its production node_modules
#   /usr/share/mill/workflows/          the workflow definitions and skills
#   /usr/share/mill/rates.yaml          the default rate table `mill cost` prices usage with
#   /usr/lib/systemd/system/mill.service
#   /usr/lib/sysusers.d/mill.conf       the `mill` system user and group
#   /usr/lib/tmpfiles.d/mill.conf       its runtime directory
#   /etc/mill/config.yaml               the worker's settings; kept on upgrade
#   /etc/mill/env                       DATABASE_URL and the like; kept on upgrade
#
# The package is the `local` workspace backend only. The machine backend's
# host half — the helper, its policy, polkit, sudoers and the SELinux
# module — is the sandbox's and is not here (docs/sandbox.md §"What the
# host provides").
name: mill
arch: ${MILL_ARCH}
platform: linux
version: ${MILL_VERSION}
release: 1
maintainer: Ivy Evans <ivy@ivyevans.net>
homepage: https://github.com/ivy/mill
description: |
  A workflow runner over dagger's work graph. It claims a ready node, drives
  each step as a headless coding-agent session or a deterministic check,
  closes steps on verified evidence, and completes the node with a result
  and provenance.
# git clones and pushes every workspace; node runs the sidecar; the
# scriptlets and the unit are systemd's.
depends:
  - git
  - nodejs
  - systemd
contents:
  - src: dist/stage/mill
    dst: /usr/bin/mill
    file_info:
      mode: 0755
  - src: dist/stage/sidecar
    dst: /usr/lib/mill/sidecar
    type: tree
  - src: workflows
    dst: /usr/share/mill/workflows
    type: tree
  - src: packaging/rates.yaml
    dst: /usr/share/mill/rates.yaml
  - src: contrib/systemd/mill.service
    dst: /usr/lib/systemd/system/mill.service
  - src: packaging/sysusers.d/mill.conf
    dst: /usr/lib/sysusers.d/mill.conf
  - src: packaging/tmpfiles.d/mill.conf
    dst: /usr/lib/tmpfiles.d/mill.conf
  - src: packaging/config.yaml
    dst: /etc/mill/config.yaml
    type: config|noreplace
  - src: packaging/env
    dst: /etc/mill/env
    type: config|noreplace
    file_info:
      mode: 0600
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
rpm:
  summary: A workflow runner over dagger's work graph
  compression: zstd
