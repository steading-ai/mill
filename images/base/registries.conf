# The public registries resolve to Harbor's proxy-cache projects, the same
# ones the host's registries.conf names, so a pull inside a machine is
# served from the cache and provenance is squid's log (docs/sandbox.md
# §Network). @HARBOR_HOST@ is replaced at build from the HARBOR_HOST
# build argument.
[[registry]]
prefix = "docker.io"
location = "@HARBOR_HOST@/dockerhub-cache"

[[registry]]
prefix = "quay.io"
location = "@HARBOR_HOST@/quay-cache"

[[registry]]
prefix = "ghcr.io"
location = "@HARBOR_HOST@/ghcr-cache"
