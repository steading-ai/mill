# quick-fix: the smallest workflow that still ships a change.
#
# Adapted from the /work-on skill's Quick Fix tier: one session gathers just
# enough context, makes the change, commits it, and opens the PR; a check
# proves the tree is clean and a gate merges. There is no plan step, no
# review step, and no human in the loop — a quick fix that needs one is the
# wrong tier, and the circuit breaker is how it reaches a person anyway.
#
# Every step names the evidence that closes it (docs/core-principles.md §8)
# and the capability set its workspace handle grants. The harness table is
# per-step because the same skill is worth a different model in a different
# workflow (docs/domain-model.md §Step).
name: quick-fix
scope: org
steps:
  # Ready the machine before any session runs: trust the checkout's mise
  # configuration and install what it pins. `mise trust` is pre-granted for
  # /work in the base image, and runs anyway so a repo whose config moved
  # is trusted too. The step closes on its exit and output whichever way it
  # ends, and its output stays out of every session; a non-zero exit is a
  # finding the first session receives, never a failed run (docs/sandbox.md
  # §"Preparatory steps"). The budget is the step's own, because a warm
  # install and a cold toolchain are nothing alike.
  - name: toolchain
    kind: preparatory
    check:
      command:
        - sh
        - -c
        - mise trust /work && mise install
    evidence: exit
    capabilities:
      - exec
    timeout: 20m

  - name: gather-context
    kind: skill
    session: implement
    skill: gather-context
    evidence: artifact
    capabilities:
      - read
    harness:
      claude:
        model: sonnet
        effort: medium
        tools:
          allow:
            - Glob
            - Grep
            - Read
    retries: 2
    timeout: 15m

  - name: implement
    kind: skill
    session: implement
    skill: implement
    evidence: artifact
    capabilities:
      - read
      - write
      - exec
    harness:
      claude:
        model: sonnet
        effort: high
        tools:
          allow:
            - Bash
            - Edit
            - Glob
            - Grep
            - Read
            - Write
    retries: 3
    timeout: 2h

  - name: commit
    kind: skill
    session: implement
    skill: commit
    evidence: commit
    capabilities:
      - write
    # No `permission_mode` and no `env`: the defaults are what this step
    # needs. A session runs under the model classifier, so an unattended
    # `git add` is answered rather than prompted, and the environment its
    # sidecar is spawned with is the worker's `--env-mode` — the floor
    # carries HOME, PATH and the rest git and the SDK need
    # (docs/architecture.md §"Skill steps: the harness adapter").
    harness:
      claude:
        model: sonnet
        effort: medium
    retries: 2
    timeout: 15m

  # The tree has to be clean before the run leaves the workspace behind.
  # This is the check that makes "exec can write" detectable in MVP. A check
  # gets no retries of its own by default — nothing changes between one
  # attempt and the next unless commit runs again — so a dirty tree goes
  # straight back to commit, the step that stages and closes on a commit
  # (docs/domain-model.md §Step, §Check; §Evidence, `commit`).
  - name: clean-tree
    kind: check
    check:
      command:
        - scripts/clean-tree
      exit:
        - 0
      stdout: none
      feedback: revise
    evidence: exit
    capabilities:
      - exec
    on_failure: revise commit
    retries: 0
    timeout: 2m

  - name: pr
    kind: skill
    session: implement
    skill: pr
    evidence: url
    capabilities:
      - forge
    harness:
      claude:
        model: sonnet
        effort: medium
    retries: 2
    timeout: 15m

  # Auto-approved: repo protections are the repo's job
  # (docs/core-principles.md §1). The gate exists so a project that wants a
  # human on its merges gets one by dropping the policy, and so the ledger
  # records that the merge was a decision.
  - name: merge
    kind: gate
    gate:
      ask:
        title: 'Merge {{.NodeRef}}?'
        body: |
          {{.NodeRef}} — {{.NodeTitle}} — is ready to merge.

          Pull request: {{.PullRequest}}

          Complete this node to merge. Drop it to leave the branch open; the
          run records the denial on {{.NodeRef}} and stops.
      auto: true
      deny_result: Merge denied by a human; the branch and its pull request are left open.
    evidence: status
    on_failure: revise implement
    retries: 1
    timeout: 168h
