// WorkerService, in its own file rather than store.proto's because
// store.proto's contract is exactly the resume algorithm's surface
// (docs/ledger.md) — an RPC with no caller there does not belong in it, and
// WorkerService has no part in resume.

syntax = "proto3";

package mill.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/steading-ai/mill/gen/mill/v1;millv1";

// WorkerService is the worker's own door, mounted only in a process
// actually running one (`mill serve --work`; docs/architecture.md §"One
// binary, two faces"). `mill doctor` calls Probe first for the three probes
// only the worker's own process can answer honestly — the sidecar it would
// spawn, the signing key it would sign with, the forge credential it would
// deliver with — so a client reaching a worker over a forwarded socket gets
// the worker's state rather than its own. `mill status`, `mill doctor` and
// `mill run` call Claims for the cheap fields the same client needs on every
// invocation: what the worker claims from, and which host it runs on. A
// `mill serve` with no worker in it does not mount this service at all,
// which answers CodeUnimplemented; that is the client's cue to fall back to
// probing locally.
service WorkerService {
  // Probe answers the sidecar, signing, and forge probes from the worker's
  // own configuration and process.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  // Claims answers what the worker claims from and which host it runs on,
  // from its own already-resolved configuration: no probe, no side effect,
  // safe to call on every `status`, `doctor` or `run` invocation.
  rpc Claims(ClaimsRequest) returns (ClaimsResponse);
  // Drain asks the worker to stop claiming and let every run in flight
  // release at its next step boundary, the same request a SIGTERM makes
  // locally. It returns at once; the caller polls Probe's state to learn
  // when the worker has actually gone idle.
  rpc Drain(DrainRequest) returns (DrainResponse);
  // RetireBranch closes a pull request and deletes its branch through the
  // worker's own forge credential, the same one `mill run` already
  // delivers with — a restarted-from shell usually holds none of its own
  // (docs/architecture.md §"Identity and credentials"), so `mill restart`
  // calls this instead of resolving a credential in its own process.
  rpc RetireBranch(RetireBranchRequest) returns (RetireBranchResponse);
}

// ProbeRequest asks the worker to run its own local-only probes. It takes
// nothing: the worker answers for its own configuration, not one the caller
// names.
message ProbeRequest {
  // Reserved: the worker probes itself, not a configuration the caller
  // names.
}

// ProbeResponse carries the three probes only the worker's own process can
// answer, in the shape `mill doctor` already prints a line for.
message ProbeResponse {
  // The sidecar probe, from the worker's own process.
  ProbeResult sidecar = 1;
  // The signing probe, from the worker's own signing key and workspace.
  ProbeResult signing = 2;
  // The forge probe, from the worker's own credential and project.
  ProbeResult forge = 3;
  // The worker's own claim/drain state.
  WorkerState state = 4;
  // The runs this worker is driving right now. Non-empty only while state is
  // draining or claiming; empty once idle.
  repeated InFlightRun in_flight = 5;
  // The upstream outage the worker is waiting out, present only while state
  // is WORKER_STATE_WAITING_ON_UPSTREAM.
  UpstreamOutage upstream_outage = 6;
}

// WorkerState is a worker's own claim/drain state, as `mill status` and
// `mill drain --wait` read it from Probe.
enum WorkerState {
  // WORKER_STATE_UNSPECIFIED is the zero value and carries no meaning.
  WORKER_STATE_UNSPECIFIED = 0;
  // WORKER_STATE_CLAIMING means the worker asks skift for work as its runs
  // in flight finish.
  WORKER_STATE_CLAIMING = 1;
  // WORKER_STATE_DRAINING means the worker has stopped claiming and is
  // waiting for its runs in flight to reach a boundary.
  WORKER_STATE_DRAINING = 2;
  // WORKER_STATE_IDLE means a drain has finished: no runs in flight, and
  // none will be claimed.
  WORKER_STATE_IDLE = 3;
  // WORKER_STATE_WAITING_ON_UPSTREAM means the worker has observed the
  // model's upstream refusing every request and has stopped claiming until
  // a probe shows it answering again.
  WORKER_STATE_WAITING_ON_UPSTREAM = 4;
}

// UpstreamOutage is the upstream refusal a worker is waiting out.
message UpstreamOutage {
  // When the worker first observed the refusal.
  google.protobuf.Timestamp since = 1;
  // When the upstream itself said it would answer again, or unset when it
  // named none.
  google.protobuf.Timestamp reset_at = 2;
}

// InFlightRun is one run a worker is driving right now, as Probe reports it.
message InFlightRun {
  // The run's id.
  string run_id = 1;
  // The node it drives.
  string node_ref = 2;
  // The step currently running.
  string current_step = 3;
  // How long the current step has been running.
  google.protobuf.Duration time_in_step = 4;
}

// ProbeResult is one probe's answer.
message ProbeResult {
  // Whether it passed.
  bool ok = 1;
  // The one line a human reads, pass or fail.
  string reason = 2;
}

// ClaimsRequest asks the worker what it claims from. It takes nothing: the
// worker answers for its own configuration, not one the caller names.
message ClaimsRequest {
  // Reserved: the worker answers for itself, not a configuration the caller
  // names.
}

// ClaimsResponse carries the worker's already-resolved claim filter and the
// host it runs on — the fields `mill status` and `mill doctor` print a
// "claims from" line from, and `mill run` compares its own host against.
message ClaimsResponse {
  // The worker's OS hostname.
  string host = 1;
  // The skift projects the worker claims from; empty means every project
  // its principal may read.
  repeated string projects = 2;
  // The labels every claimed node must carry.
  repeated string labels = 3;
}

// DrainRequest asks the worker to drain. It takes nothing: the worker drains
// itself, not a configuration the caller names.
message DrainRequest {
  // Reserved: the worker drains itself, not a configuration the caller
  // names.
}

// DrainResponse is empty: Drain is fire-and-forget, and the caller polls
// Probe to learn when the worker has actually gone idle.
message DrainResponse {}

// RetireBranchRequest names the branch a restart has ended, and the project
// it lives in, since a worker may claim from more than one.
message RetireBranchRequest {
  // The skift project the branch's repository belongs to.
  string project = 1;
  // The branch to close and delete.
  string branch = 2;
  // The comment left on the pull request when it is closed, if one is open.
  string comment = 3;
}

// RetireBranchResponse carries the pull request that was closed, if any.
message RetireBranchResponse {
  // The closed pull request's URL, or empty when the branch had none open.
  string pull_request_url = 1;
}
