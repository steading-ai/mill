// WorkerService, in its own file rather than store.proto's because
// store.proto's contract is exactly the resume algorithm's surface
// (docs/ledger.md) — an RPC with no caller there does not belong in it, and
// WorkerService has no part in resume.

syntax = "proto3";

package mill.v1;

option go_package = "github.com/ivy/mill/gen/mill/v1;millv1";

// WorkerService is the worker's own door, mounted only in a process
// actually running one (`mill serve --work`; docs/architecture.md §"One
// binary, two faces"). `mill doctor` calls Probe first for the three probes
// only the worker's own process can answer honestly — the sidecar it would
// spawn, the signing key it would sign with, the forge credential it would
// deliver with — so a client reaching a worker over a forwarded socket gets
// the worker's state rather than its own. `mill status`, `mill doctor` and
// `mill run` call Claims for the cheap fields the same client needs on every
// invocation: what the worker claims from, and which host it runs on. A
// `mill serve` with no worker in it does not mount this service at all,
// which answers CodeUnimplemented; that is the client's cue to fall back to
// probing locally.
service WorkerService {
  // Probe answers the sidecar, signing, and forge probes from the worker's
  // own configuration and process.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  // Claims answers what the worker claims from and which host it runs on,
  // from its own already-resolved configuration: no probe, no side effect,
  // safe to call on every `status`, `doctor` or `run` invocation.
  rpc Claims(ClaimsRequest) returns (ClaimsResponse);
}

// ProbeRequest asks the worker to run its own local-only probes. It takes
// nothing: the worker answers for its own configuration, not one the caller
// names.
message ProbeRequest {
  // Reserved: the worker probes itself, not a configuration the caller
  // names.
}

// ProbeResponse carries the three probes only the worker's own process can
// answer, in the shape `mill doctor` already prints a line for.
message ProbeResponse {
  // The sidecar probe, from the worker's own process.
  ProbeResult sidecar = 1;
  // The signing probe, from the worker's own signing key and workspace.
  ProbeResult signing = 2;
  // The forge probe, from the worker's own credential and project.
  ProbeResult forge = 3;
}

// ProbeResult is one probe's answer.
message ProbeResult {
  // Whether it passed.
  bool ok = 1;
  // The one line a human reads, pass or fail.
  string reason = 2;
}

// ClaimsRequest asks the worker what it claims from. It takes nothing: the
// worker answers for its own configuration, not one the caller names.
message ClaimsRequest {
  // Reserved: the worker answers for itself, not a configuration the caller
  // names.
}

// ClaimsResponse carries the worker's already-resolved claim filter and the
// host it runs on — the fields `mill status` and `mill doctor` print a
// "claims from" line from, and `mill run` compares its own host against.
message ClaimsResponse {
  // The worker's OS hostname.
  string host = 1;
  // The dagger projects the worker claims from; empty means every project
  // its principal may read.
  repeated string projects = 2;
  // The labels every claimed node must carry.
  repeated string labels = 3;
}
