// The mill.v1 store API: what `mill work` speaks to `mill serve` over
// Connect. docs/ledger.md is its rationale — the resume algorithm there is
// the specification, and this service exposes exactly the calls that
// algorithm makes, plus the reads the CLI needs. Nothing more: an RPC with
// no caller in either does not belong here.
//
// This is not a public API. It is spoken only between this binary's own two
// faces, so it carries no versioning ceremony beyond `buf breaking`. The
// Connect boundary exists from the first commit so that a second worker on
// another host is a configuration change.

syntax = "proto3";

package mill.v1;

import "google/protobuf/timestamp.proto";
import "harness/v1/harness.proto";
import "mill/v1/mill.proto";

option go_package = "github.com/steading-ai/mill/gen/mill/v1;millv1";

// StoreService is the ledger's one door. It reads and writes the record of
// what happened inside a run: selection, step runs, evidence, sessions,
// tokens, and usage.
//
// Lease fencing. Every mutating request carries `lease_id`, the dagger lease
// the caller believes it holds. The store takes the run's row lock
// (`SELECT … FOR UPDATE`), re-reads `lease_id` in a separate statement after
// the lock is granted — a locked row is not re-read, so a lease a concurrent
// claim committed while waiting would otherwise be missed — compares it to
// the lease the request presented, and rolls the transaction back on
// mismatch. The comparison happens inside the same transaction as the write
// it guards, so a stale worker cannot corrupt the record however well it is
// behaving; see docs/ledger.md Invariant 9. A fenced-out write is the normal
// path for a stale worker, not an error to retry: it abandons the run
// locally and goes back to ClaimNext.
//
// Three mutations sit outside that rule and say so on their requests:
// SetLease, which is the write that changes what later comparisons compare
// against; PutWorkflow and PutSkill, whose rows are not run-scoped; and
// FinishWorkspace, the one write made after the run has ended and released
// its lease, which the run's ended state admits instead.
service StoreService {
  // GetRunByNode returns the live run for a dagger node, or nothing. The
  // first call a worker makes after a claim.
  rpc GetRunByNode(GetRunByNodeRequest) returns (GetRunByNodeResponse);
  // CreateRun opens a run on a node in status selecting. At most one live
  // run per node; the store rejects a second.
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  // SetLease makes a claim's lease the run's current one, so every later
  // write is fenced by it.
  rpc SetLease(SetLeaseRequest) returns (SetLeaseResponse);
  // StartStepRun opens the next attempt at a step, numbering it max+1 for
  // the (run, step) pair. At most one running attempt per run.
  rpc StartStepRun(StartStepRunRequest) returns (StartStepRunResponse);
  // RecordStepEnvironment records what the environment mode gave a skill
  // step's session process: what the step asked to have passed through, and
  // what the deny list removed.
  rpc RecordStepEnvironment(RecordStepEnvironmentRequest) returns (RecordStepEnvironmentResponse);
  // MarkSessionStarted records that the harness has produced an event in an
  // attempt's session, so the session exists to be resumed. Called when the
  // first event arrives rather than when the turn ends, so an attempt the
  // worker died in still says its session was started.
  rpc MarkSessionStarted(MarkSessionStartedRequest) returns (MarkSessionStartedResponse);
  // CloseStepRun records the evidence that closes an attempt and marks it
  // closed, in one transaction. The only way a step becomes closed.
  rpc CloseStepRun(CloseStepRunRequest) returns (CloseStepRunResponse);
  // FailStepRun marks an attempt failed with how its process ended, so the
  // step's on_failure can be applied.
  rpc FailStepRun(FailStepRunRequest) returns (FailStepRunResponse);
  // AbortOpenStepRuns marks any still-running attempt aborted. Called on
  // resume, when a running row belongs to a dead or fenced-out worker.
  rpc AbortOpenStepRuns(AbortOpenStepRunsRequest) returns (AbortOpenStepRunsResponse);
  // SupersedeSteps marks the latest attempts of every step from a target
  // through a failing step superseded, which is what moves current_step
  // backwards for a revise.
  rpc SupersedeSteps(SupersedeStepsRequest) returns (SupersedeStepsResponse);
  // MarkWaiting records the gate a run is blocked on and marks it waiting.
  // Called between the patch that files the gate and the release, so a crash
  // never leaves a gate the store would file twice.
  rpc MarkWaiting(MarkWaitingRequest) returns (MarkWaitingResponse);
  // Park trips the circuit breaker: the run stops, a gate asks a human what
  // to do, and the reason says what stopped it.
  rpc Park(ParkRequest) returns (ParkResponse);
  // RecordNotice appends what carrying a filed gate to a person did: which
  // gate, how the configured notify command ended, and what it said. The
  // mill's notification is not the run's work — a command that fails or
  // never runs does not fail the run — so it is a row of the audit trail
  // and nothing else.
  rpc RecordNotice(RecordNoticeRequest) returns (RecordNoticeResponse);
  // RecordHeartbeat appends one heartbeat the harness sent a session that
  // ended its turn with a background task that had gone silent. It changes
  // no run state: the row of the audit trail is the whole record, and
  // `mill inspect` counts the rows to say what an attempt's wait cost.
  rpc RecordHeartbeat(RecordHeartbeatRequest) returns (RecordHeartbeatResponse);
  // RecordInstall appends what a session installed into its machine with
  // the `dnf` shim, as the shim reported it over the workspace socket
  // (docs/sandbox.md §"The dnf shim"). It changes no run state: the row of
  // the audit trail is the run's provenance of an undeclared install, for
  // an operator to see which projects keep needing something `mill.toml`
  // does not name. It is not routed to a reviewer.
  rpc RecordInstall(RecordInstallRequest) returns (RecordInstallResponse);
  // RecordReconciliation appends what one reconciliation pass found and did:
  // at worker start, the machines it told from the ledger's live runs —
  // orphans stopped, lost sandboxes noted, slices reaped for resume — the
  // leftovers it removed, and the scratch projects it swept by name
  // (docs/sandbox.md §Reconciliation, §"External state"); at start and
  // between claims, the runs it found stranded under a node dagger had
  // closed (docs/ledger.md §Sweep). It is a record of the host and of the
  // ledger against dagger, not of a run: no lease fences it, because the
  // pass runs while the worker holds none on what it touches.
  rpc RecordReconciliation(RecordReconciliationRequest) returns (RecordReconciliationResponse);
  // RecordWorkspace records the run's workspace once it is open: its kind,
  // where it is, the ref it was made at, and the machine behind it when
  // there is one (docs/ledger.md §workspaces). A run whose workspace is
  // already on record — one reattached on resume — has the record brought
  // up to date rather than a second row.
  rpc RecordWorkspace(RecordWorkspaceRequest) returns (RecordWorkspaceResponse);
  // FinishWorkspace records the workspace's end: its files destroyed, and
  // the generation each cache lineage promoted (docs/sandbox.md §Promote).
  rpc FinishWorkspace(FinishWorkspaceRequest) returns (FinishWorkspaceResponse);
  // SetCompleteRequestId mints and stores the idempotency key of the patch
  // that completes the node, before that patch is sent. Minting is once per
  // run: a second call returns the key already stored, so a worker resuming
  // a run whose completing patch may have landed retries the same patch
  // rather than sending a second one.
  rpc SetCompleteRequestId(SetCompleteRequestIdRequest) returns (SetCompleteRequestIdResponse);
  // Done marks a run done. Called only after dagger has confirmed the
  // completing patch: a run marked done before that would strand a node
  // nothing can claim.
  rpc Done(DoneRequest) returns (DoneResponse);
  // Fail ends a run a human refused: the gate on its way out was denied, or
  // the node was dropped underneath it. The node's result already says why;
  // this is the ledger catching up with it.
  rpc Fail(FailRequest) returns (FailResponse);
  // Resume clears the gate a run stopped on once it has been answered, so
  // the run is running again and the next gate step files its own. A run
  // parked by the circuit breaker needs it: its current step is not a gate
  // step, so nothing else would ever clear the park gate.
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  // Abandon marks a run abandoned so a new generation can be created. The
  // restart path, and the only caller of it is a human.
  rpc Abandon(AbandonRequest) returns (AbandonResponse);
  // Cancel asks the run's worker to stop at the next heartbeat. It is a
  // request, not a transition: the flag is set, the worker reads it, aborts
  // the step and releases its lease, and the run stays resumable. The only
  // mutation a principal that holds no lease makes to a run's own row, and
  // the reason the role map exists.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Rerun supersedes every step from a named step through the run's current
  // one and leaves the run resumable at the named step. The mechanism a
  // revise uses, driven by a person instead of a verdict: the generation,
  // the branch and the sessions are kept, so what a rerun throws away is the
  // span's attempts and nothing else. Carries no lease, for the same reason
  // Cancel does not — the caller is a person, not the worker.
  rpc Rerun(RerunRequest) returns (RerunResponse);
  // IssueStepToken mints the step-scoped bearer a session presents on the
  // workspace socket. The bearer is returned once; the store keeps its hash.
  rpc IssueStepToken(IssueStepTokenRequest) returns (IssueStepTokenResponse);
  // RevokeStepToken revokes a bearer. Written in the same transaction that
  // moves its step run out of running.
  rpc RevokeStepToken(RevokeStepTokenRequest) returns (RevokeStepTokenResponse);
  // RecordUsage appends what a turn cost, per model, to the ledger.
  rpc RecordUsage(RecordUsageRequest) returns (RecordUsageResponse);
  // MarkUsagePosted marks a step run's usage rows as posted to dagger, after
  // ReportUsage has accepted them.
  rpc MarkUsagePosted(MarkUsagePostedRequest) returns (MarkUsagePostedResponse);
  // GetWorkflow returns one workflow version, by id or by name in a scope.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  // ListWorkflows lists workflow versions in a scope, newest first.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // PutWorkflow stores a workflow version. Idempotent by content hash:
  // storing the same definition twice returns the existing version.
  rpc PutWorkflow(PutWorkflowRequest) returns (PutWorkflowResponse);
  // PutSkill stores a skill by name and digest, so a workflow version pins
  // the exact prompt it ran. Idempotent by digest.
  rpc PutSkill(PutSkillRequest) returns (PutSkillResponse);
  // GetSkill returns the skill a workflow step pins, by name and digest. A
  // step carries only the reference, so `mill workflow pull` needs this to
  // write SKILL.md back out.
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  // Status lists runs by state with what the ledger derives: current step,
  // cost, and the gate a waiting run is blocked on.
  rpc Status(StatusRequest) returns (StatusResponse);
  // ListRuns lists runs filtered and windowed, in keyset pages: the runs
  // that ended, newest first, for a console's run history that wants
  // enough on each row to say what a run came to without an Inspect per
  // row. Empty statuses means every terminal state, ordered and paged by
  // (ended_at, id); a non-terminal status among them orders and pages by
  // (updated_at, id) instead, since ended_at is null on a live run — so a
  // caller can list live runs through this one RPC too. Mixing a terminal
  // and a non-terminal status in one call orders and pages the whole
  // response by (updated_at, id), the same rule as an all-non-terminal
  // filter.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // Inspect returns one run's every attempt in order with its evidence,
  // exit, session, and usage.
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // History returns a run's audit trail, oldest first: the events rows.
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Cost rolls a window of usage up by run, by workflow, by step name and
  // by model. Counts, never currency: a rate table is applied by whoever
  // wants money (docs/ledger.md §usage).
  rpc Cost(CostRequest) returns (CostResponse);
  // Health is what the service can say about itself: its version, whether
  // the database answers, and whether the schema is the one this binary
  // carries. `mill doctor` probes the socket and the migrations with it.
  rpc Health(HealthRequest) returns (HealthResponse);
  // WhoAmI is what the socket makes of the caller: the peer uid and the role
  // the map gives it. `mill mcp` asks before it offers a tool that changes
  // something the store does not hold, so a reader is refused by the same
  // policy that refuses it Cancel.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Logs streams one run's activity, oldest first: every closed attempt of
  // the step in start order, then the live attempt, then — with follow —
  // whatever arrives next. With no run named it streams every run's
  // activity instead, ordered for resume by a cursor. docs/activity.md
  // §The RPC is the specification this call implements.
  rpc Logs(LogsRequest) returns (stream LogsResponse);
  // SealAttempt records a closed attempt's index rows, once its frame and
  // twin are written. Idempotent: inserting a row seal already recorded
  // (same step_run_id, seq) is a no-op, so a seal retried after a lost
  // response never double-counts. docs/activity.md §Lifecycle's Seal step.
  rpc SealAttempt(SealAttemptRequest) returns (SealAttemptResponse);
  // WatchRuns streams the ledger's events table from a cursor: every run,
  // not one. The first message on a fresh subscription carries only the
  // opening position, so a caller that reads it before doing anything else
  // never misses an event that lands between opening the stream and acting
  // on what it saw. A cursor older than the replay window is refused with
  // FailedPrecondition naming the window. docs/ledger.md §events.
  rpc WatchRuns(WatchRunsRequest) returns (stream WatchRunsResponse);
}

// GetRunByNodeRequest asks for the live run on a node.
message GetRunByNodeRequest {
  // The dagger node's id.
  string node_id = 1;
}

// GetRunByNodeResponse carries the run, or nothing when the node has none.
message GetRunByNodeResponse {
  // The live run, unset when there is none.
  Run run = 1;
  // The generation a new run on this node takes: one past the newest run
  // the node has had, abandoned ones included, so a claim after a restart
  // — or after a restart that stopped short of creating the next
  // generation — never collides with the record (Invariant 1). 1 when the
  // node has never run.
  int64 next_generation = 2;
}

// CreateRunRequest opens a run on a claimed node.
message CreateRunRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The dagger node's id.
  string node_id = 2;
  // The node's display key.
  string node_ref = 3;
  // Dagger's context id for the node, copied at creation.
  string context_id = 4;
  // 1 for the first run on a node; restart passes the next generation.
  int64 generation = 5;
  // Where this attempt runs.
  string worker_ref = 6;
  // The run's git branch, derived from the node ref.
  string branch = 7;
}

// CreateRunResponse carries the created run.
message CreateRunResponse {
  // The run, in status selecting.
  Run run = 1;
}

// SetLeaseRequest makes a claim's lease the run's current one.
message SetLeaseRequest {
  // The new lease. SetLease is the one write the presented lease is not
  // compared against the stored one: it is the write that changes what later
  // comparisons compare against. It takes the same row lock and requires the
  // run's status to be one a new claim may take over — running with an
  // expired lease, waiting, parked, or done with the node still open.
  string lease_id = 1;
  // The run to fence.
  string run_id = 2;
  // The worker taking it over.
  string worker_ref = 3;
}

// SetLeaseResponse carries the run under its new lease.
message SetLeaseResponse {
  // The run, now running under the presented lease.
  Run run = 1;
}

// StartStepRunRequest opens the next attempt at a step.
message StartStepRunRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run the attempt belongs to.
  string run_id = 2;
  // The step from the run's workflow definition.
  string step_name = 3;
  // The step's kind, copied onto the attempt so the row reads alone.
  StepKind kind = 4;
  // Skill steps: the session this attempt runs in.
  string session_id = 5;
  // The worker running it.
  string worker_ref = 6;
  // The step run whose failure this attempt is the revise for, or empty.
  string feedback_from = 7;
  // The head of the run's branch when the attempt started, so what the
  // attempt made is what the branch gained. Empty when the run has no
  // checkout to read a head from.
  string base_commit = 8;
}

// StartStepRunResponse carries the opened attempt.
message StartStepRunResponse {
  // The attempt, numbered max+1 for its (run, step) pair.
  StepRun step_run = 1;
}

// RecordStepEnvironmentRequest records what a skill step's session process
// was given, so the ledger shows what a workflow asked for and what the deny
// list took away.
message RecordStepEnvironmentRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt whose session was spawned.
  string step_run_id = 2;
  // The variables the step asked to have carried from the mill's own
  // environment.
  repeated string env_passthrough = 3;
  // The deny-listed variables that were present and removed.
  repeated string env_stripped = 4;
}

// RecordStepEnvironmentResponse carries the attempt with its environment
// recorded.
message RecordStepEnvironmentResponse {
  // The attempt.
  StepRun step_run = 1;
}

// MarkSessionStartedRequest records that an attempt's session has produced
// its first event, which is what makes the session resumable.
message MarkSessionStartedRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt whose session spoke.
  string step_run_id = 2;
}

// MarkSessionStartedResponse carries the attempt with its session recorded
// as started.
message MarkSessionStartedResponse {
  // The attempt.
  StepRun step_run = 1;
}

// CloseStepRunRequest records the evidence that closes an attempt.
message CloseStepRunRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt to close.
  string step_run_id = 2;
  // The fact that closes it. Insert-only; a step run has at most one.
  Evidence evidence = 3;
  // Set only when the closing step is the selection step: the workflow
  // version the assessment named. The store applies it to the run, which may
  // happen exactly once.
  string workflow_id = 4;
  // Set only when the closing step is the selection step: the tier the
  // assessment named, which gate auto predicates compare against.
  Tier tier = 5;
  // Set only by a gate step the `auto` predicate closed without a human.
  // The ledger records that the decision was a policy's and not a person's.
  bool auto_approved = 6;
}

// CloseStepRunResponse carries the closed attempt and its evidence.
message CloseStepRunResponse {
  // The attempt, now closed.
  StepRun step_run = 1;
  // The evidence as stored.
  Evidence evidence = 2;
}

// FailStepRunRequest marks an attempt failed.
message FailStepRunRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt that failed.
  string step_run_id = 2;
  // How the process ended. A status of -1 means it never ran.
  harness.v1.ProcessExit exit = 3;
}

// FailStepRunResponse carries the failed attempt.
message FailStepRunResponse {
  // The attempt, now failed.
  StepRun step_run = 1;
}

// AbortOpenStepRunsRequest closes out a dead worker's attempts.
message AbortOpenStepRunsRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction. The resume algorithm calls this before
  // SetLease, when the stored lease is still the dead worker's, so the store
  // accepts the presented lease under the same conditions SetLease does.
  // docs/ledger.md §Resume says every store call is fenced by Invariant 9
  // and orders this call before SetLease; the two cannot both hold, and the
  // ordering wins because it is what makes resume work.
  string lease_id = 1;
  // The run whose running attempts are stale.
  string run_id = 2;
  // Why they were aborted, for the event log: crashed, fenced, cancelled.
  string reason = 3;
}

// AbortOpenStepRunsResponse carries what was aborted.
message AbortOpenStepRunsResponse {
  // The attempts that were running and are now aborted.
  repeated StepRun step_runs = 1;
}

// SupersedeStepsRequest reopens a span of steps for a revise.
message SupersedeStepsRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run being revised.
  string run_id = 2;
  // The step to return to. Its latest attempt is superseded along with every
  // step after it, so current_step becomes this one.
  string from_step = 3;
  // The failing step whose on_failure asked for the revise. Superseded
  // inclusive.
  string through_step = 4;
}

// SupersedeStepsResponse carries what was reopened.
message SupersedeStepsResponse {
  // The attempts now superseded. Their evidence rows stay, immutable, and no
  // longer close anything.
  repeated StepRun step_runs = 1;
}

// MarkWaitingRequest records the gate a run is blocked on.
message MarkWaitingRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run that filed the gate.
  string run_id = 2;
  // The gate node dagger returned. Recorded after the patch and before the
  // release; a gate is filed once.
  string gate_node_id = 3;
  // The gate step's attempt, which stays open until the gate completes.
  string step_run_id = 4;
}

// MarkWaitingResponse carries the waiting run.
message MarkWaitingResponse {
  // The run, now waiting and holding no lease.
  Run run = 1;
}

// ParkRequest trips the circuit breaker.
message ParkRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run to park.
  string run_id = 2;
  // The gate node asking a human what to do.
  string gate_node_id = 3;
  // What stopped the run.
  ParkedReason reason = 4;
}

// ParkResponse carries the parked run.
message ParkResponse {
  // The run, now parked and holding no lease.
  Run run = 1;
}

// RecordNoticeRequest records one attempt to carry a gate to a person.
message RecordNoticeRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction. The notice is written while the gate's
  // lease is still held, before the write that parks or waits the run and
  // takes the lease off it.
  string lease_id = 1;
  // The run whose gate was carried.
  string run_id = 2;
  // The attempt that filed the gate, when it was a step's.
  string step_run_id = 3;
  // What the gate decides: `plan`, `merge` or `park`.
  string kind = 4;
  // The gate node the person is being pointed at.
  string gate_ref = 5;
  // How the command ended: its exit status, or -1 when a signal ended it or
  // it never ran at all.
  int32 exit_code = 6;
  // What the command said for itself: its standard error, or why it could
  // not be run.
  string detail = 7;
}

// RecordNoticeResponse carries nothing: the event is the record.
message RecordNoticeResponse {
  // Reserved: the event the call wrote is the whole of the answer.
}

// RecordHeartbeatRequest records one heartbeat sent to a silent session.
message RecordHeartbeatRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run whose session was asked.
  string run_id = 2;
  // The attempt whose session was asked.
  string step_run_id = 3;
  // Which heartbeat this is, counting from one.
  int32 strike = 4;
  // How many silent heartbeats trip the harness's breaker.
  int32 strikes = 5;
  // How long the turn had been over when the heartbeat was sent, in seconds.
  int64 waiting_seconds = 6;
  // The tasks that had gone silent, as the harness described them.
  repeated string tasks = 7;
}

// RecordHeartbeatResponse carries nothing: the event is the record.
message RecordHeartbeatResponse {
  // Reserved: the event the call wrote is the whole of the answer.
}

// RecordInstallRequest records one install a session made with the shim.
message RecordInstallRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run whose machine the packages went into.
  string run_id = 2;
  // The attempt whose session installed them.
  string step_run_id = 3;
  // The packages, as the shim named them.
  repeated string packages = 4;
}

// RecordInstallResponse carries nothing: the event is the record.
message RecordInstallResponse {
  // Reserved: the event the call wrote is the whole of the answer.
}

// RecordReconciliationRequest records one reconciliation pass. It carries
// no lease: the pass runs before the worker holds one, and what it records
// is the host's state, not a run's, so there is no run row to fence it by.
message RecordReconciliationRequest {
  // The worker that ran the pass.
  string worker_ref = 1;
  // When the pass began.
  google.protobuf.Timestamp started_at = 2;
  // What it found and did, in order.
  repeated ReconciliationFinding findings = 3;
}

// ReconciliationFinding is one line of a reconciliation pass.
message ReconciliationFinding {
  // What was found: `orphan`, `lost-sandbox`, `resumable`, `leftover`,
  // `swept`, `disagreement`, `stranded`, `failure`.
  string kind = 1;
  // The thing: a machine, a run id, a path, a project.
  string name = 2;
  // What was done to it: `stopped`, `terminated`, `removed`, `archived`,
  // `deleted`, `failed`, `done`; empty when nothing was.
  string action = 3;
  // What qualifies it: the run's step, the unit, why a delete was an
  // archive.
  string detail = 4;
}

// RecordReconciliationResponse carries nothing: the row is the record.
message RecordReconciliationResponse {
  // Reserved: the row the call wrote is the whole of the answer.
}

// RecordWorkspaceRequest records the run's workspace once it is open.
message RecordWorkspaceRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run the workspace belongs to.
  string run_id = 2;
  // How the workspace is realised.
  WorkspaceKind kind = 3;
  // Where it is: the worker that holds it.
  string worker_ref = 4;
  // The git ref checked out at creation.
  string ref = 5;
  // The machine behind it. Unset for a workspace with no machine; a
  // machine-backed workspace's lineages carry their restored generations
  // and no promoted one yet.
  Sandbox sandbox = 6;
}

// RecordWorkspaceResponse carries the workspace as recorded.
message RecordWorkspaceResponse {
  // The workspace row, its state live.
  Workspace workspace = 1;
}

// FinishWorkspaceRequest records that the run's workspace was destroyed
// and what its caches promoted. It is the one write made after the run has
// ended: the files go once dagger has confirmed the completing patch and the
// store has marked the run done, and the promotion happens as they go
// (docs/ledger.md §Resume). By then the run holds no lease, so the store
// admits the write when the run has ended and holds none; while the run is
// live the lease is compared as for every other write.
message FinishWorkspaceRequest {
  // The lease the caller held. Compared against the run's current lease
  // while the run is live; once the run has ended and released its lease,
  // the run's ended state is what admits the write.
  string lease_id = 1;
  // The run the workspace belongs to.
  string run_id = 2;
  // Each lineage the run promoted, with the generation it made. A lineage
  // the run restored and did not promote is left as it was recorded.
  repeated SandboxLineage promoted = 3;
}

// FinishWorkspaceResponse carries the workspace as recorded.
message FinishWorkspaceResponse {
  // The workspace row, its state destroyed.
  Workspace workspace = 1;
}

// SetCompleteRequestIdRequest asks for the run's completing request id.
message SetCompleteRequestIdRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run about to be completed.
  string run_id = 2;
  // The key to store if the run has none. Ignored when it already has one.
  string request_id = 3;
}

// SetCompleteRequestIdResponse carries the key the completing patch must
// use, which is the stored one whether or not this call minted it.
message SetCompleteRequestIdResponse {
  // The run, carrying its complete_request_id.
  Run run = 1;
}

// DoneRequest marks a run done.
message DoneRequest {
  // The lease the caller held. The completing patch releases the lease as
  // part of itself, so this is the lease that was current when the patch was
  // sent; it is compared against the run's current lease inside the writing
  // transaction.
  string lease_id = 1;
  // The run dagger has confirmed complete.
  string run_id = 2;
}

// DoneResponse carries the finished run.
message DoneResponse {
  // The run, now done.
  Run run = 1;
}

// FailRequest ends a run a gate denied.
message FailRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run to fail.
  string run_id = 2;
  // Why, for the event log. The node's own result carries the gate's
  // deny_result, which is what a human reads.
  string reason = 3;
}

// FailResponse carries the failed run.
message FailResponse {
  // The run, now failed.
  Run run = 1;
}

// ResumeRequest clears the gate an answered run stopped on.
message ResumeRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The run whose gate has been answered.
  string run_id = 2;
}

// ResumeResponse carries the run with no gate on it.
message ResumeResponse {
  // The run, running, with gate_node_id cleared.
  Run run = 1;
}

// AbandonRequest marks a run abandoned so a new generation can be created.
message AbandonRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction. Empty when the restart path has already
  // released the lease, which is the ordinary case.
  string lease_id = 1;
  // The run to abandon. Its step runs, evidence, and usage stay as the
  // record of what went wrong.
  string run_id = 2;
  // Why, for the event log and the comment on the node.
  string reason = 3;
}

// AbandonResponse carries the abandoned run.
message AbandonResponse {
  // The run, now abandoned.
  Run run = 1;
}

// CancelRequest asks a run's worker to stop cleanly.
message CancelRequest {
  // The run to cancel. Cancel carries no lease: the caller is a human or an
  // agent asking the worker to stop, not the worker itself. Who asked is the
  // connection's own identity, never a field of the request.
  string run_id = 1;
  // Why, for the event log.
  string reason = 2;
}

// RerunRequest redoes a span of a run's steps without a new generation.
message RerunRequest {
  // The run to rerun. Like Cancel, it carries no lease: the caller is a
  // person, and who asked is the connection's own identity.
  string run_id = 1;
  // The first step to redo. Every step from it through the run's current
  // step is superseded; a step with no attempt in this run is refused.
  string from_step = 2;
  // Why, for the event log.
  string reason = 3;
}

// RerunResponse carries what the rerun undid.
message RerunResponse {
  // The run, unchanged but for the span behind it.
  Run run = 1;
  // The last step of the span: the step the run was on.
  string through_step = 2;
  // The attempts that were superseded, in workflow order.
  repeated StepRun step_runs = 3;
  // Whether the run had ended and was made live again. Only a `failed` run
  // is: a rerun on one is a person overruling the ending, and a span
  // superseded on a run no claim can take over would strand the node.
  bool reopened = 4;
}

// CancelResponse carries the run the request was recorded on.
message CancelResponse {
  // The run, with cancel_requested set. Its status is unchanged: the worker
  // is what stops it.
  Run run = 1;
}

// IssueStepTokenRequest mints the credential a session will hold.
message IssueStepTokenRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt the token is scoped to. It must be running.
  string step_run_id = 2;
  // Copied from the step at issue.
  repeated Capability capabilities = 3;
}

// IssueStepTokenResponse carries the token, bearer included, once.
message IssueStepTokenResponse {
  // The token. Its `token` field is populated here and nowhere else; the
  // store holds only the hash.
  StepToken step_token = 1;
}

// RevokeStepTokenRequest revokes a bearer.
message RevokeStepTokenRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The token to revoke.
  string step_token_id = 2;
}

// RevokeStepTokenResponse carries the revoked token.
message RevokeStepTokenResponse {
  // The token, now revoked, without its bearer.
  StepToken step_token = 1;
}

// RecordUsageRequest appends what a turn cost.
message RecordUsageRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt the cost is attributed to.
  string step_run_id = 2;
  // One row per model the turn billed.
  repeated Usage usage = 3;
}

// RecordUsageResponse carries what was appended.
message RecordUsageResponse {
  // The rows as stored.
  repeated Usage usage = 1;
}

// MarkUsagePostedRequest marks a step's usage as reported to dagger.
message MarkUsagePostedRequest {
  // The lease the caller holds, compared against the run's current lease
  // inside the writing transaction.
  string lease_id = 1;
  // The attempt whose unposted rows were just reported.
  string step_run_id = 2;
}

// MarkUsagePostedResponse says how much was marked.
message MarkUsagePostedResponse {
  // How many rows were marked posted.
  int64 marked = 1;
}

// GetWorkflowRequest asks for one workflow version.
message GetWorkflowRequest {
  // The version's id. When set, the rest is ignored.
  string id = 1;
  // The workflow's name, resolved to the newest version in scope.
  string name = 2;
  // The scope to resolve in. A project scope falls back to org.
  Scope scope = 3;
  // The project, when the scope is project.
  string project = 4;
  // A specific content hash, when a run pins one.
  string version = 5;
}

// GetWorkflowResponse carries the version.
message GetWorkflowResponse {
  // The workflow, unset when nothing resolved.
  Workflow workflow = 1;
}

// ListWorkflowsRequest asks for the workflow versions in a scope.
message ListWorkflowsRequest {
  // Only this name. Empty means every name.
  string name = 1;
  // The scope to list. Unspecified means both.
  Scope scope = 2;
  // The project, when the scope is project.
  string project = 3;
  // Whether to list every version rather than the newest of each name.
  bool all_versions = 4;
}

// ListWorkflowsResponse carries the versions, newest first.
message ListWorkflowsResponse {
  // The workflows.
  repeated Workflow workflows = 1;
  // The rows the listing could not decode and left out.
  repeated UndecodableWorkflow findings = 2;
}

// UndecodableWorkflow is a workflow row whose stored bytes the service could
// not decode — a row an older or newer mill wrote with a field this one does
// not know. The listing that met it goes on without it. The row itself is
// untouched: reported, neither deleted nor repaired.
message UndecodableWorkflow {
  // The row's id.
  string workflow_id = 1;
  // The field of the stored definition that failed to decode, as the JSON
  // names it, with a dotted path into a nested message. Empty when the
  // failure is not one field's.
  string field = 2;
  // The decoder's own account of the failure.
  string detail = 3;
}

// PutWorkflowRequest stores a workflow version.
message PutWorkflowRequest {
  // The lease the caller holds. Empty for a CLI push, which holds no lease:
  // workflows are not run-scoped, and docs/ledger.md Invariant 9 fences only
  // writes to a run's own rows. The field is present because every mutating
  // request carries one, and the store compares it inside the writing
  // transaction whenever it is set.
  string lease_id = 1;
  // The definition to store. Its version is computed from the content; a
  // version already present is returned unchanged.
  Workflow workflow = 2;
}

// PutWorkflowResponse carries the stored version.
message PutWorkflowResponse {
  // The workflow as stored, with its id, version, and created_at.
  Workflow workflow = 1;
  // Whether this call created the version rather than finding it.
  bool created = 2;
}

// PutSkillRequest stores a skill.
message PutSkillRequest {
  // The lease the caller holds. Empty for a CLI push, for the same reason as
  // PutWorkflow: skills are not run-scoped. Compared inside the writing
  // transaction whenever it is set.
  string lease_id = 1;
  // The skill to store. A digest already present is returned unchanged.
  Skill skill = 2;
}

// PutSkillResponse carries the stored skill.
message PutSkillResponse {
  // The skill as stored.
  Skill skill = 1;
  // Whether this call created the row rather than finding it.
  bool created = 2;
}

// GetSkillRequest asks for the skill a step pins.
message GetSkillRequest {
  // The skill's name, from SKILL.md frontmatter.
  string name = 1;
  // The content hash the workflow step references.
  string digest = 2;
}

// GetSkillResponse carries the skill.
message GetSkillResponse {
  // The skill, unset when no row has that name and digest.
  Skill skill = 1;
}

// StatusRequest asks what every run is doing.
message StatusRequest {
  // Only runs in these states. Empty means every non-terminal state.
  repeated RunStatus statuses = 1;
  // Only runs on nodes in this dagger project. Empty means every project.
  string project = 2;
}

// StatusResponse carries the runs and what the ledger derives about them.
message StatusResponse {
  // One entry per run, most recently updated first.
  repeated RunSummary runs = 1;
  // The workflow rows the listing could not decode. A run whose workflow is
  // among them is still listed, with no current step, since the step is
  // derived from the definition.
  repeated UndecodableWorkflow findings = 2;
}

// ListRunsRequest asks for runs filtered and windowed, one page at a time.
message ListRunsRequest {
  // Only runs in these states. Empty means every terminal state: done,
  // failed, abandoned.
  repeated RunStatus statuses = 1;
  // Only runs on nodes in this dagger project. Empty means every project.
  string project = 2;
  // Only the run(s) on this node's display key, every generation included.
  // Empty means every node.
  string node_ref = 3;
  // Only runs whose current or last worker is this one. Empty means every
  // worker.
  string worker_ref = 4;
  // Only runs on this workflow version. Empty means every version.
  string workflow_id = 5;
  // Only runs that ended at or after this instant. Unset means no lower
  // bound. Ignored for a request whose statuses order by updated_at rather
  // than ended_at.
  google.protobuf.Timestamp ended_after = 6;
  // Only runs that ended before this instant. Unset means no upper bound.
  // Ignored for the same requests ended_after is.
  google.protobuf.Timestamp ended_before = 7;
  // How many rows to return. 0 means the default, 50. Clamped to 200;
  // ListRunsResponse.limit_clamped says when a request asked for more.
  int32 limit = 8;
  // Opaque. Empty for the first page; otherwise the next_cursor a previous
  // response of the same filter returned. A cursor is meaningless against a
  // different filter or a different statuses ordering than the response it
  // came from.
  string cursor = 9;
  // How much of each run to render: "refs" (identifiers alone), "summary"
  // (the default), or "full". A run's summary carries nothing "full" adds
  // beyond it — there is no deeper structure to expand the way Inspect's
  // steps have — so the two answer alike; "refs" skips every derived field
  // for a cheaper page when a caller wants only what to Inspect next.
  string view = 10;
}

// ListRunsResponse carries one page of runs and what the ledger derives
// about them.
message ListRunsResponse {
  // One entry per run, ordered as the request's statuses decide (see
  // ListRuns).
  repeated RunSummary runs = 1;
  // Opaque. Pass back as the next call's cursor to continue. Empty when
  // this page was the last.
  string next_cursor = 2;
  // The workflow rows the listing could not decode, as Status's does.
  repeated UndecodableWorkflow findings = 3;
  // Set when the request's limit exceeded 200 and was clamped to it.
  bool limit_clamped = 4;
}

// InspectRequest asks for one run in full.
message InspectRequest {
  // The run's id. When set, the rest is ignored.
  string id = 1;
  // The node's display key, for a human who has that instead.
  string node_ref = 2;
}

// InspectResponse carries the run, its definition, and its every attempt.
message InspectResponse {
  // The run and what the ledger derives about it.
  RunSummary summary = 1;
  // The workflow version the run follows, unset while selecting.
  Workflow workflow = 2;
  // Every attempt in order, with its evidence, session, and usage.
  repeated StepRunDetail steps = 3;
}

// HistoryRequest asks for a run's audit trail.
message HistoryRequest {
  // The run's id. When set, the rest is ignored.
  string id = 1;
  // The node's display key, for a human who has that instead.
  string node_ref = 2;
}

// HistoryResponse carries the events rows, oldest first.
message HistoryResponse {
  // Every event recorded against the run, in the order they happened.
  repeated Event events = 1;
}

// CostRequest asks what a window of runs billed.
message CostRequest {
  // Only usage recorded at or after this instant. Unset means everything.
  google.protobuf.Timestamp since = 1;
  // Only runs on nodes in this dagger project. Empty means every project.
  string project = 2;
  // Only usage recorded before this instant. Unset means no upper bound.
  google.protobuf.Timestamp until = 3;
  // Whether, and how, to also group the window over time.
  TimeBucket bucket = 4;
}

// CostResponse carries the same usage rolled up four ways, because the
// question "what did this cost" is asked of a run, of a workflow, of a step
// and of a model, and one pass over the rows answers all four.
message CostResponse {
  // By run, keyed by the run's node reference.
  repeated CostBucket by_run = 1;
  // By workflow, keyed by name and version.
  repeated CostBucket by_workflow = 2;
  // By step, keyed by the workflow's name and version and the step name, so
  // two versions of one workflow are distinct buckets. Carries StepCounts.
  repeated CostBucket by_step = 3;
  // By model.
  repeated CostBucket by_model = 4;
  // By UTC calendar day, one bucket per day in the window, keyed by date
  // such as `2026-09-21`. Present only when the request set bucket to
  // TIME_BUCKET_DAY.
  repeated CostBucket by_day = 5;
}

// HealthRequest asks the service about itself. It takes nothing: identity is
// the socket's peer uid and there is nothing else to say.
message HealthRequest {
  // Reserved: the probe takes no arguments today.
}

// HealthResponse is what the service can say about itself, which is what
// `mill doctor` turns into a pass or a fail with one line of reason.
message HealthResponse {
  // The version of the binary serving.
  string version = 1;
  // Whether the database answered the probe.
  bool database = 2;
  // The newest migration applied to the database.
  int64 migration_version = 3;
  // The newest migration this binary carries. Equal to migration_version
  // when the schema is current.
  int64 migration_wanted = 4;
  // Why database is false, or why the versions could not be read. Empty
  // when everything answered.
  string detail = 5;
}

// WhoAmIRequest asks the socket who is calling. It takes nothing: identity
// is the peer uid and there is nothing a request body could add.
message WhoAmIRequest {
  // Reserved: the question takes no arguments.
}

// WhoAmIResponse is the caller as the interceptor resolved it.
message WhoAmIResponse {
  // The peer uid the kernel reported.
  int64 uid = 1;
  // The role the map gives it: service, operator, or reader.
  string role = 2;
}

// LogsRequest names what Logs streams: one run's activity, or every run's,
// windowed and paged by a cursor. docs/activity.md §The RPC is the
// specification.
message LogsRequest {
  // The run, as Inspect takes it. Both id and node_ref empty is every run.
  string id = 1;
  // The run, as Inspect takes it. Both id and node_ref empty is every run.
  string node_ref = 2;
  // Narrow to one step of the run.
  string step = 3;
  // Narrow to one attempt of step. 0 is every attempt.
  int64 attempt = 4;
  // Keep the stream open until the run ends, or, with no run, until the
  // client goes.
  bool follow = 5;
  // Send only the last N records on record before going live. 0 is none.
  int64 tail = 6;
  // Resume after this record; what a client that reconnected last saw.
  Cursor after = 7;
  // Page backwards: the limit records immediately before this one, in seq
  // order. Refused together with follow.
  Cursor before = 8;
  // At most this many records, then the stream ends. 0 is no limit. With
  // after and limit 1 it is one record, whole: how a body a followed
  // stream cut is fetched entire.
  int64 limit = 9;
  // With no run: records at or after this time.
  google.protobuf.Timestamp since = 10;
}

// Cursor names one record: the attempt it belongs to and its position
// within it.
message Cursor {
  // The step run the record belongs to.
  string step_run_id = 1;
  // The record's 1-based position within the attempt.
  int64 seq = 2;
}

// LogsResponse is one frame of a Logs stream: an activity record, or the
// run leaving the states a worker acts in.
message LogsResponse {
  // The frame: one activity record, or the run ending.
  oneof frame {
    // One activity record.
    Activity activity = 1;
    // The run left the states a worker acts in; the last frame of a
    // followed stream over one run. gate is set for waiting and parked.
    RunEnd run = 2;
  }
}

// RunEnd is the last frame of a followed stream over one run: it stopped
// being running, and why.
message RunEnd {
  // The run that ended.
  string run_id = 1;
  // The status it ended in: done, failed, abandoned, waiting, or parked.
  RunStatus status = 2;
  // Set for waiting and parked: the gate the run is blocked on.
  GateRef gate = 3;
}

// GateRef names the gate node a waiting or parked run is blocked on.
message GateRef {
  // The gate node's id.
  string node_id = 1;
  // The gate node's reference.
  string node_ref = 2;
}

// SealAttemptRequest carries one attempt's index rows, computed by the
// worker from the frame it just wrote and verified. It carries no lease:
// the attempt this seals has already closed and released its own, and
// activity is not one of the tables a lease fences.
message SealAttemptRequest {
  // The attempt these rows index.
  string step_run_id = 1;
  // One row per record in the sealed frame, in seq order.
  repeated ActivityIndexRow records = 2;
}

// SealAttemptResponse carries the rows the call actually inserted. A row
// whose (step_run_id, seq) was already recorded — a retry after a lost
// response — is skipped, not returned, so an empty list is a valid answer.
message SealAttemptResponse {
  // The rows this call inserted, in the order given.
  repeated ActivityIndexRow records = 1;
}

// WatchRunsRequest opens (or resumes) the ledger's change stream.
message WatchRunsRequest {
  // Resume after this position; opaque, as returned in a prior
  // WatchRunsResponse.cursor. Empty starts from the moment the call is
  // received.
  string cursor = 1;
  // Only events for runs on nodes in this dagger project.
  string project = 2;
}

// WatchRunsResponse is one frame of a WatchRuns stream: an event, or, on
// the first message of a fresh subscription, the opening position alone.
message WatchRunsResponse {
  // Where this message leaves the stream; a later call resumes after it.
  string cursor = 1;
  // The event, unset on the first message of a fresh subscription and on a
  // keepalive sent when nothing has happened.
  RunEvent event = 2;
}

// RunEvent is one row of the events table, named for a subscriber that has
// not read the run: no before/after, no other run content.
message RunEvent {
  // The run the event belongs to.
  string run_id = 1;
  // The run's node, for a subscriber that filters or routes by node.
  string node_ref = 2;
  // The attempt the event belongs to, when it belongs to one.
  string step_run_id = 3;
  // What happened, matching events.op in docs/ledger.md §events.
  string op = 4;
  // When the event was written.
  google.protobuf.Timestamp occurred_at = 5;
}
