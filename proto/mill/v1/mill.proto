// The mill.v1 domain model: what happened inside a run. This file is the
// contract the store, its API, and the worker are derived from;
// docs/domain-model.md is its rationale and docs/ledger.md its storage.
//
// The mill holds exactly one kind of state dagger does not — which workflow,
// which step, what evidence, which session. Where dagger already names a
// thing (node, lease, gate, artifact, usage, principal, context id) this
// package stores dagger's *identifier* and never dagger's content, so a
// message here is never a copy of a message there.
//
// Where a field's comment and docs/domain-model.md disagree, the comment
// says so rather than choosing silently.

syntax = "proto3";

package mill.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "harness/v1/harness.proto";

option go_package = "github.com/ivy/mill/gen/mill/v1;millv1";

// RunStatus is where a run is. The states and the transitions between them
// are docs/domain-model.md §"Run states".
enum RunStatus {
  // RUN_STATUS_UNSPECIFIED is the zero value and carries no meaning.
  RUN_STATUS_UNSPECIFIED = 0;
  // RUN_STATUS_SELECTING means the node is claimed and has no workflow yet.
  // The assessment step runs here.
  RUN_STATUS_SELECTING = 1;
  // RUN_STATUS_RUNNING means a lease is held and a step is executing or
  // about to.
  RUN_STATUS_RUNNING = 2;
  // RUN_STATUS_WAITING means a gate node exists and blocks this node. The
  // run holds no lease and no worker.
  RUN_STATUS_WAITING = 3;
  // RUN_STATUS_PARKED means the circuit breaker fired: a gate asks a human
  // what to do and the lease is released. Structurally identical to
  // WAITING; distinguished so status can say why.
  RUN_STATUS_PARKED = 4;
  // RUN_STATUS_DONE means the terminal step closed with evidence and the
  // completing patch was accepted by dagger.
  RUN_STATUS_DONE = 5;
  // RUN_STATUS_FAILED means a gate was denied, or the node was dropped
  // underneath the run. Terminal.
  RUN_STATUS_FAILED = 6;
  // RUN_STATUS_ABANDONED means a human restarted the node and a new
  // generation exists. Terminal. docs/ledger.md's `runs` table omits this
  // state from its status list; docs/domain-model.md §Run defines it and
  // wins.
  RUN_STATUS_ABANDONED = 7;
}

// ParkedReason says why the circuit breaker tripped, so the gate that asks a
// human what to do can say what stopped.
enum ParkedReason {
  // PARKED_REASON_UNSPECIFIED is the zero value: the run is not parked.
  PARKED_REASON_UNSPECIFIED = 0;
  // PARKED_REASON_RETRIES means the failing step exhausted its retries.
  PARKED_REASON_RETRIES = 1;
  // PARKED_REASON_BUDGET means the run reached its spending cap.
  PARKED_REASON_BUDGET = 2;
  // PARKED_REASON_DENIED means a human denied a gate.
  PARKED_REASON_DENIED = 3;
  // PARKED_REASON_TIMEOUT means a step exceeded its wall clock.
  PARKED_REASON_TIMEOUT = 4;
  // PARKED_REASON_REFUSED means the mill refused to continue: an invariant
  // the store could not reconcile, such as a done run on an open node.
  PARKED_REASON_REFUSED = 5;
}

// StepKind says how a step is executed. Four kinds, no more:
// docs/domain-model.md §Step.
enum StepKind {
  // STEP_KIND_UNSPECIFIED is the zero value and carries no meaning.
  STEP_KIND_UNSPECIFIED = 0;
  // STEP_KIND_SKILL runs a skill as a headless session and produces
  // artifacts and, where the definition says so, structured output.
  STEP_KIND_SKILL = 1;
  // STEP_KIND_CHECK runs a command through the workspace and reads its exit
  // code and stdout. It produces evidence directly.
  STEP_KIND_CHECK = 2;
  // STEP_KIND_GATE files a dagger gate and releases the lease. It produces
  // no evidence of its own; the gate's result is the evidence.
  STEP_KIND_GATE = 3;
  // STEP_KIND_PREPARATORY readies the machine for the sessions: a command
  // run through the workspace whose exit and captured output are the
  // evidence, whichever way it exited. A non-zero exit or a spent budget is
  // a finding carried to the first session, never a failed attempt
  // (docs/sandbox.md §"Preparatory steps").
  STEP_KIND_PREPARATORY = 4;
}

// StepRunStatus is the state of one attempt at a step. docs/ledger.md
// §step_runs.
enum StepRunStatus {
  // STEP_RUN_STATUS_UNSPECIFIED is the zero value and carries no meaning.
  STEP_RUN_STATUS_UNSPECIFIED = 0;
  // STEP_RUN_STATUS_RUNNING means the attempt is in flight. At most one per
  // run.
  STEP_RUN_STATUS_RUNNING = 1;
  // STEP_RUN_STATUS_CLOSED means evidence exists for this attempt.
  STEP_RUN_STATUS_CLOSED = 2;
  // STEP_RUN_STATUS_FAILED means the attempt ended and on_failure applies.
  STEP_RUN_STATUS_FAILED = 3;
  // STEP_RUN_STATUS_ABORTED means the worker stopped or was fenced out
  // before the attempt ended; the next worker starts a new attempt.
  STEP_RUN_STATUS_ABORTED = 4;
  // STEP_RUN_STATUS_SUPERSEDED means a later revise reopened this step; the
  // row and its evidence stay as the record of pass one.
  STEP_RUN_STATUS_SUPERSEDED = 5;
}

// EvidenceKind names what closes a step, and therefore how the mill verified
// it. docs/domain-model.md §Evidence lists what each kind proves.
enum EvidenceKind {
  // EVIDENCE_KIND_UNSPECIFIED is the zero value and carries no meaning.
  EVIDENCE_KIND_UNSPECIFIED = 0;
  // EVIDENCE_KIND_COMMIT closes commit steps: `git cat-file -e <sha>` in the
  // workspace succeeds and the SHA is on the run's branch.
  EVIDENCE_KIND_COMMIT = 1;
  // EVIDENCE_KIND_EXIT closes check steps such as build, test, and lint: the
  // process the workspace ran exited with the code the definition names.
  EVIDENCE_KIND_EXIT = 2;
  // EVIDENCE_KIND_VERDICT closes review steps: the session's final output
  // parsed as a verdict whose decision is approve.
  EVIDENCE_KIND_VERDICT = 3;
  // EVIDENCE_KIND_STRUCTURED closes assessment and plan steps: the session's
  // final output validated against the step's schema.
  EVIDENCE_KIND_STRUCTURED = 4;
  // EVIDENCE_KIND_URL closes PR steps: the forge returned the URL when asked
  // for the PR by branch.
  EVIDENCE_KIND_URL = 5;
  // EVIDENCE_KIND_STATUS closes CI steps: the forge reports the named check
  // as success for the commit.
  EVIDENCE_KIND_STATUS = 6;
  // EVIDENCE_KIND_ARTIFACT closes any step: an artifact with this digest was
  // accepted by dagger.
  EVIDENCE_KIND_ARTIFACT = 7;
  // EVIDENCE_KIND_GATE closes gate steps: the gate node's status is done and
  // its result is attached.
  EVIDENCE_KIND_GATE = 8;
}

// Capability is one thing a step may do through its workspace.
// docs/domain-model.md §"Capability set".
enum Capability {
  // CAPABILITY_UNSPECIFIED is the zero value and grants nothing.
  CAPABILITY_UNSPECIFIED = 0;
  // CAPABILITY_READ grants reading files in the checkout.
  CAPABILITY_READ = 1;
  // CAPABILITY_WRITE grants writing files, staging, and committing on the
  // run's branch.
  CAPABILITY_WRITE = 2;
  // CAPABILITY_EXEC grants running commands in the checkout.
  CAPABILITY_EXEC = 3;
  // CAPABILITY_NETWORK grants outbound network from commands.
  CAPABILITY_NETWORK = 4;
  // CAPABILITY_FORGE grants a forge credential scoped to the project's
  // repository: push the branch, open and query a PR, read CI status.
  CAPABILITY_FORGE = 5;
  // CAPABILITY_DEPLOY grants whatever the project's deploy step needs,
  // defined per project.
  CAPABILITY_DEPLOY = 6;
}

// Tier is how much work a node is, and what gate auto predicates compare
// against. Every run has one by the time its first gate is evaluated, from
// the assessment or from the project default.
enum Tier {
  // TIER_UNSPECIFIED is the zero value and carries no meaning.
  TIER_UNSPECIFIED = 0;
  // TIER_QUICK_FIX is a change a single step can carry.
  TIER_QUICK_FIX = 1;
  // TIER_SMALL is a change with a handful of steps and no design decision.
  TIER_SMALL = 2;
  // TIER_FEATURE is a change worth planning and reviewing.
  TIER_FEATURE = 3;
  // TIER_LARGE is a change a human should look at before it merges.
  TIER_LARGE = 4;
}

// Scope says how widely a workflow applies. A project definition overrides an
// org one; a shadowing definition logs a warning at load, mirroring the
// agent-skills precedence rule.
enum Scope {
  // SCOPE_UNSPECIFIED is the zero value and carries no meaning.
  SCOPE_UNSPECIFIED = 0;
  // SCOPE_ORG makes the workflow available to every project in the
  // organization.
  SCOPE_ORG = 1;
  // SCOPE_PROJECT restricts the workflow to one project, named alongside it.
  SCOPE_PROJECT = 2;
}

// SourceKind says where a stored definition came from.
enum SourceKind {
  // SOURCE_KIND_UNSPECIFIED is the zero value and carries no meaning.
  SOURCE_KIND_UNSPECIFIED = 0;
  // SOURCE_KIND_REPO means the definition was seeded from files in a
  // repository at a commit.
  SOURCE_KIND_REPO = 1;
  // SOURCE_KIND_CLI means a principal pushed the definition with the CLI.
  SOURCE_KIND_CLI = 2;
}

// StdoutShape is what a check's stdout is expected to be, following the
// agent-skills script convention: JSON on stdout, diagnostics on stderr.
enum StdoutShape {
  // STDOUT_SHAPE_UNSPECIFIED is the zero value and carries no meaning.
  STDOUT_SHAPE_UNSPECIFIED = 0;
  // STDOUT_SHAPE_NONE means stdout is ignored.
  STDOUT_SHAPE_NONE = 1;
  // STDOUT_SHAPE_TEXT means stdout is captured as text.
  STDOUT_SHAPE_TEXT = 2;
  // STDOUT_SHAPE_JSON means stdout is parsed as JSON and validated against
  // the check's schema.
  STDOUT_SHAPE_JSON = 3;
}

// Feedback says what a check's failure does with its stderr.
enum Feedback {
  // FEEDBACK_UNSPECIFIED is the zero value and carries no meaning.
  FEEDBACK_UNSPECIFIED = 0;
  // FEEDBACK_REVISE returns stderr to the session as the next prompt.
  FEEDBACK_REVISE = 1;
  // FEEDBACK_PARK parks the run instead of feeding anything back.
  FEEDBACK_PARK = 2;
}

// OnFailureKind is what a step's failure does to the run. There is no
// branching in a workflow except this.
enum OnFailureKind {
  // ON_FAILURE_KIND_UNSPECIFIED is the zero value; the loader treats it as
  // PARK, which is the documented default.
  ON_FAILURE_KIND_UNSPECIFIED = 0;
  // ON_FAILURE_KIND_REVISE returns to a named earlier step in its session
  // with the failure as the next prompt.
  ON_FAILURE_KIND_REVISE = 1;
  // ON_FAILURE_KIND_PARK trips the circuit breaker.
  ON_FAILURE_KIND_PARK = 2;
}

// VerdictDecision is a reviewer's answer. There is no needs-human decision: a
// human is reached only through the circuit breaker.
enum VerdictDecision {
  // VERDICT_DECISION_UNSPECIFIED is the zero value and carries no meaning.
  VERDICT_DECISION_UNSPECIFIED = 0;
  // VERDICT_DECISION_APPROVE closes the review step.
  VERDICT_DECISION_APPROVE = 1;
  // VERDICT_DECISION_REVISE sends the work back. A revise with zero blocking
  // findings is not a revise: it names nothing to send back, and the output
  // is refused as malformed.
  VERDICT_DECISION_REVISE = 2;
}

// FindingSeverity says whether a finding blocks approval.
enum FindingSeverity {
  // FINDING_SEVERITY_UNSPECIFIED is the zero value and carries no meaning.
  FINDING_SEVERITY_UNSPECIFIED = 0;
  // FINDING_SEVERITY_BLOCKING must be addressed before approval.
  FINDING_SEVERITY_BLOCKING = 1;
  // FINDING_SEVERITY_NOTE is recorded and does not block. A finding the
  // reviewer could not tie to an acceptance criterion is recorded as this.
  FINDING_SEVERITY_NOTE = 2;
}

// WorkspaceKind is how a workspace is realised. The workflow definition does
// not change across these; if it has to, the seam leaked.
enum WorkspaceKind {
  // WORKSPACE_KIND_UNSPECIFIED is the zero value and carries no meaning.
  WORKSPACE_KIND_UNSPECIFIED = 0;
  // WORKSPACE_KIND_LOCAL is a clone under the mill's own account, isolated
  // by that account and the tool policy.
  WORKSPACE_KIND_LOCAL = 1;
  // WORKSPACE_KIND_CONTAINER is a clone in a rootless podman container.
  WORKSPACE_KIND_CONTAINER = 2;
  // WORKSPACE_KIND_REMOTE is a clone on another host reached over the
  // tailnet.
  WORKSPACE_KIND_REMOTE = 3;
  // WORKSPACE_KIND_MACHINE is a clone on the host bind-mounted into a
  // systemd-nspawn machine of the run's own (docs/sandbox.md).
  WORKSPACE_KIND_MACHINE = 4;
}

// WorkspaceState is whether a workspace's files still exist.
enum WorkspaceState {
  // WORKSPACE_STATE_UNSPECIFIED is the zero value and carries no meaning.
  WORKSPACE_STATE_UNSPECIFIED = 0;
  // WORKSPACE_STATE_LIVE means the run is executing in it.
  WORKSPACE_STATE_LIVE = 1;
  // WORKSPACE_STATE_RETAINED means the run is waiting or parked and the
  // files are kept so a resume or a human finds them intact.
  WORKSPACE_STATE_RETAINED = 2;
  // WORKSPACE_STATE_DESTROYED means the files are gone; the row stays.
  WORKSPACE_STATE_DESTROYED = 3;
}

// UsageSource is who counted a usage row: the harness adapter, reporting
// what the SDK told it, or the credential gateway, counting the model's own
// `usage` block on every response it forwarded. The two are kept as separate
// rows so that what a session reported and what the model billed can be
// read beside each other (docs/sandbox.md §Credentials).
enum UsageSource {
  // USAGE_SOURCE_UNSPECIFIED is the zero value and reads as the adapter's.
  USAGE_SOURCE_UNSPECIFIED = 0;
  // USAGE_SOURCE_SDK is the adapter's report of what the harness billed.
  USAGE_SOURCE_SDK = 1;
  // USAGE_SOURCE_GATEWAY is the credential gateway's count, taken from the
  // upstream's response outside the session.
  USAGE_SOURCE_GATEWAY = 2;
}

// Run is one node, worked through one workflow, by this mill: the unit a
// worker takes and the unit a workspace belongs to.
message Run {
  // ULID, internal.
  string id = 1;
  // The dagger node.
  string node_id = 2;
  // The display key (`dagger#18`).
  string node_ref = 3;
  // 1 for the first run on a node; incremented by restart.
  // `(node_id, generation)` is unique; at most one run per node is live.
  // docs/ledger.md's `runs` table has no such column and calls `node_id`
  // unique outright; docs/domain-model.md §Restart requires the generation
  // and wins.
  int64 generation = 4;
  // Dagger's context id for the node, copied at creation. Every session in
  // the run derives from it and the generation.
  string context_id = 5;
  // The immutable workflow version this run follows. Fixed at selection;
  // never changes mid-run. Empty while selecting.
  string workflow_id = 6;
  // Where the run is. See RunStatus.
  RunStatus status = 7;
  // The current dagger lease, or empty while waiting or parked. The fencing
  // token on every dagger write.
  string lease_id = 8;
  // Where the current attempt runs. Free string; a hostname and account
  // today.
  string worker_ref = 9;
  // Set with parked: why the breaker tripped.
  ParkedReason parked_reason = 10;
  // Set with waiting: the gate this run filed and is blocked on.
  string gate_node_id = 11;
  // Set by cancel; the worker reads it at every heartbeat and stops the step
  // cleanly, releasing with preempted. Cleared on resume.
  bool cancel_requested = 12;
  // The run's git branch, derived from the node ref. From docs/ledger.md
  // §runs; docs/domain-model.md carries it on the workspace instead, and the
  // store keeps it on the run so a resume elsewhere can clone before a
  // workspace row exists.
  string branch = 13;
  // The tier this run was assessed at, or the project default's. What gate
  // auto predicates compare against, so it always exists by the first gate.
  Tier tier = 14;
  // When the run was created.
  google.protobuf.Timestamp created_at = 15;
  // When the run last changed.
  google.protobuf.Timestamp updated_at = 16;
  // When the run reached a terminal state. From docs/ledger.md §runs.
  google.protobuf.Timestamp ended_at = 17;
  // The idempotency key of the patch that completes the node, minted and
  // stored before that patch is sent. A worker resuming a run whose
  // completing patch may or may not have landed retries it under the same
  // key rather than under a new one, which is what makes "dagger first,
  // store second" recoverable (docs/ledger.md §Resume, Invariant 11).
  string complete_request_id = 18;
}

// StepRun is one attempt at a step. Append-only: an interrupted step starts a
// new attempt from the top rather than resuming.
message StepRun {
  // ULID.
  string id = 1;
  // The run this attempt belongs to.
  string run_id = 2;
  // The step from the run's workflow definition.
  string step_name = 3;
  // 1-based per `(run_id, step_name)`.
  int64 attempt = 4;
  // Copied at start so the row reads alone.
  StepKind kind = 5;
  // Skill steps: the session this attempt ran in.
  string session_id = 6;
  // The dagger lease held when this attempt ran.
  string lease_id = 7;
  // The worker that ran this attempt.
  string worker_ref = 8;
  // Where the attempt is. See StepRunStatus.
  StepRunStatus status = 9;
  // Skill and check steps: how the process ended. A status of -1 means it
  // never ran.
  harness.v1.ProcessExit exit = 10;
  // The step run whose failure this attempt is the revise for, or empty.
  string feedback_from = 11;
  // Gate steps: true when the auto predicate closed it without a human.
  bool auto_approved = 12;
  // When the attempt started.
  google.protobuf.Timestamp started_at = 13;
  // When the attempt ended.
  google.protobuf.Timestamp ended_at = 14;
  // Skill steps: the variables the step asked to have carried from the
  // mill's own environment into its session's process, as the adapter
  // applied them. A step that asked for nothing has none.
  repeated string env_passthrough = 15;
  // Skill steps: the deny-listed variables that were present in the mill's
  // environment and removed before the session's process was spawned. The
  // deny list is not configurable, so this is a record and not a setting.
  repeated string env_stripped = 16;
  // The head of the run's branch when this attempt started. A `commit`
  // step closes on a commit that descends from it and is not it, which is
  // what makes the evidence a commit the step made rather than whatever
  // the branch already pointed at. Every kind records it: it is what a
  // rerun of a superseded span has to reason about what that span
  // produced. Empty when the run had no checkout to read a head from.
  string base_commit = 17;
  // Skill steps: the harness produced at least one event in this attempt's
  // session, so a conversation exists under that session id. It is what says
  // whether the next attempt at the session starts it or resumes it; the
  // attempt number does not, because an attempt that died before the harness
  // said anything left nothing to resume.
  bool session_started = 18;
}

// Finding is one thing a reviewer found, tied to an acceptance criterion.
message Finding {
  // The node's acceptance criterion this finding is against, by label. A
  // reviewer that cannot tie a finding to a criterion is drifting from its
  // contract, and the finding is recorded as a note.
  string criterion = 1;
  // Whether the finding blocks approval.
  FindingSeverity severity = 2;
  // What is wrong, in one sentence.
  string summary = 3;
  // Where, as `path:line`.
  string location = 4;
}

// Verdict is a review step's structured output. Parsed, never read: the
// decision closes the step or sends the work back, and no prose in it is
// evidence.
message Verdict {
  // Approve or revise.
  VerdictDecision decision = 1;
  // What the reviewer found.
  repeated Finding findings = 2;
}

// Evidence is an externally verified fact that closes a step. Immutable once
// recorded. Nothing the session says, and nothing in a transcript, is
// evidence.
message Evidence {
  // The step run it closes.
  string step_run_id = 1;
  // Which kind of fact this is. Redundant with the `value` oneof and stored
  // so a row reads without unpacking it.
  EvidenceKind kind = 2;
  // The fact itself, in the shape the kind defines.
  oneof value {
    // A commit SHA on the run's branch.
    string commit = 3;
    // How the process the workspace ran ended.
    harness.v1.ProcessExit exit = 4;
    // A parsed review verdict whose decision is approve.
    Verdict verdict = 5;
    // A JSON document validated against the step's schema.
    google.protobuf.Struct structured = 6;
    // A URL the forge returned.
    string url = 7;
    // A status string the forge reports for the commit.
    string status = 8;
    // An artifact digest dagger accepted.
    string artifact = 9;
    // The gate node's id, whose result is attached to the closing step.
    string gate = 10;
  }
  // Which check or which mill routine established it.
  string verified_by = 11;
  // When it was established.
  google.protobuf.Timestamp verified_at = 12;
  // What the process wrote, both streams as they arrived, for a step whose
  // evidence is the record of its run rather than a code it passed with: a
  // preparatory step (docs/sandbox.md §"Preparatory steps"). Empty for every
  // other kind.
  string output = 13;
}

// Session is a resumable agent session inside a run. Named by the step
// definition, identified deterministically, owned by the run. A session's
// transcript lives with the harness on the worker's host, never in the store.
message Session {
  // The run this session belongs to. Composite key with `name`.
  string run_id = 1;
  // The step's session value: implement, review. Composite key with
  // `run_id`.
  string name = 2;
  // UUIDv5 of (`context_id`, `generation`, `name`). Deterministic, so a
  // resumed worker computes the same id and the harness resumes the same
  // transcript; a restart's new generation yields ids the harness has never
  // seen. docs/ledger.md §sessions omits the generation from the tuple;
  // docs/domain-model.md §Session includes it and wins, because without it a
  // restart would reuse the abandoned run's transcripts.
  string id = 3;
  // claude-code today. Which adapter owns it.
  string harness = 4;
  // Whatever the adapter needs to find the transcript: a config dir and cwd
  // for Claude Code.
  google.protobuf.Struct adapter_ref = 5;
  // The host the transcript is on. A different worker cannot
  // transcript-resume; it graph-resumes with a fresh session of the same id.
  // From docs/ledger.md §sessions.
  string worker_ref = 6;
  // When the session first ran.
  google.protobuf.Timestamp started_at = 7;
  // When it last took a turn.
  google.protobuf.Timestamp last_turn_at = 8;
}

// Source is where a stored definition came from, so a ledger entry can say
// exactly which definition produced it.
message Source {
  // Whether the definition was seeded from a repository or pushed.
  SourceKind kind = 1;
  // The repository it was seeded from.
  string repo = 2;
  // The commit it was seeded at.
  string commit = 3;
  // The path within the repository.
  string path = 4;
  // The pushing principal, for a CLI push.
  string pushed_by = 5;
}

// SkillRef pins the exact prompt a step ran: a skill is referenced by name
// and content hash, so two workflows sharing a skill share the record.
message SkillRef {
  // The skill's name, from SKILL.md frontmatter.
  string name = 1;
  // Content hash of the skill directory, resolved from the store at workflow
  // load.
  string digest = 2;
}

// Skill is the portable part of a step, stored so a workflow version pins the
// exact prompt it ran. docs/ledger.md §skills.
message Skill {
  // ULID.
  string id = 1;
  // From SKILL.md frontmatter.
  string name = 2;
  // Content hash of the skill directory.
  string digest = 3;
  // The SKILL.md body, the prompt.
  string body = 4;
  // Manifest of scripts/, assets/, references/: path to digest. Bytes are
  // stored in the store's blob table by digest.
  map<string, string> files = 5;
  // The flat string map from frontmatter.
  map<string, string> metadata = 6;
  // Where this skill came from.
  Source source = 7;
  // When it was stored.
  google.protobuf.Timestamp created_at = 8;
  // From SKILL.md frontmatter. The one field besides `name` every
  // agent-skills client carries, and what a router matches a node against.
  string description = 9;
}

// Check is a deterministic command a step runs through the workspace. Checks
// are what make a workflow enforced: a skill can recommend a script, only a
// check step makes the mill run it and act on the result.
message Check {
  // Path relative to the skill directory or the workflow, plus arguments.
  // Executed by Workspace.Exec, never directly.
  repeated string command = 1;
  // Which codes mean pass. Empty means 0.
  repeated int32 exit = 2;
  // What stdout is expected to be.
  StdoutShape stdout = 3;
  // JSON Schema stdout is validated against when `stdout` is JSON.
  string stdout_schema = 4;
  // Whether a failure's stderr is returned to the session as the next prompt
  // or parks the run.
  Feedback feedback = 5;
}

// Ask is a gate node's title and body, templated from the run: which node,
// which step, what is being asked, what the artifacts are.
message Ask {
  // The gate node's title.
  string title = 1;
  // The gate node's body, as markdown.
  string body = 2;
}

// Gate is a human decision, expressed the only way dagger allows: a node with
// assignee_kind user that blocks this run's node. The mill files it, never
// claims it, never completes it, and never disposes of it.
message Gate {
  // The gate node's title and body, templated from the run.
  Ask ask = 1;
  // A policy that closes the gate without a human: a predicate over prior
  // evidence and the run's tier, such as
  // `verdict.decision == approve && tier <= feature`. Recorded in the ledger
  // as an auto-approval when it fires. Empty means always ask.
  string auto = 2;
  // What the run records on the node if the human denies.
  string deny_result = 3;
}

// OnFailure is what a step's failure does to the run.
message OnFailure {
  // Revise or park. Default park.
  OnFailureKind kind = 1;
  // The step to return to, for a revise. Must be earlier in the workflow; a
  // target that is not is a definition error caught at load. Every step from
  // the target through the failing step is superseded, so revised work is
  // re-checked, re-committed, and re-reviewed.
  string revise_target = 2;
}

// HarnessSettings is one adapter's entry in a step's harness table: the
// options document that adapter's harness runs the step under, carried
// verbatim.
//
// Mill interprets nothing inside it. What a knob means is the harness's to
// say, so the harness validates the document and refuses what it does not
// know; a harness that grows a knob is a harness change and a workflow
// change, and neither this contract nor the mill is rebuilt for it.
//
// Resolves docs/domain-model.md's open question "whether harness settings
// belong on the step or on the skill record": on the step, because a skill
// shared between a docs workflow and a feature workflow is worth a different
// model in each and the skill record cannot hold both.
message HarnessSettings {
  // The options document, as the workflow's yaml block gave it.
  google.protobuf.Struct options = 1;
}

// Step is one unit of a workflow. Steps run in order; there is no branching
// except on_failure.
message Step {
  // Unique within the workflow. The ledger's key for the step.
  string name = 1;
  // skill, check, gate, or preparatory.
  StepKind kind = 2;
  // Skill steps only. Names the session this step runs in; steps sharing a
  // name resume the same session.
  string session = 3;
  // Skill steps: the skill's name and content hash, resolved from the store
  // at workflow load.
  SkillRef skill = 4;
  // Check steps: command path relative to the skill or workflow, exit-code
  // semantics, expected stdout shape. Preparatory steps: the command alone;
  // the exit codes, stdout shape and feedback are a check's contract and a
  // preparatory step has none.
  Check check = 5;
  // Gate steps: the ask, and the auto-approve policy.
  Gate gate = 6;
  // What closes this step.
  EvidenceKind evidence = 7;
  // The capability set the step's workspace handle grants.
  repeated Capability capabilities = 8;
  // Per-harness options documents, keyed by harness name; the adapter reads
  // its own entry and mill reads none of them.
  map<string, HarnessSettings> harness = 9;
  // What a failure does: revise a named earlier step, or park. Default park.
  OnFailure on_failure = 10;
  // How many times this step may fail with revise before park. Counted on
  // this step's attempts. Default 3.
  int32 retries = 11;
  // Wall clock for the step, enforced by the worker. Independent of the
  // dagger lease, which the worker heartbeats for the step's whole duration;
  // a step may run longer than a lease TTL.
  google.protobuf.Duration timeout = 12;
  // JSON Schema the session's structured output must validate against, for a
  // skill step whose evidence is structured.
  string output_schema = 13;
  // Where an `artifact` step's evidence is read from, when it is not the
  // session's final message.
  ArtifactSource artifact = 14;
  // How many tokens one attempt of this step may bill through the
  // credential gateway — input, output, cache read and cache write summed —
  // before the gateway refuses its requests and the attempt fails
  // (docs/sandbox.md §Credentials). Zero declares no budget.
  int64 token_budget = 15;
  // The models this step's sessions may reach through the gateway. An entry
  // matches a requested model id it equals or that contains it, so `sonnet`
  // pins every Sonnet. Empty pins nothing and admits every model.
  repeated string models = 16;
}

// ArtifactSource says where a step's artifact evidence comes from. A step
// that declares none closes on the session's final message, which is the
// default and what most skill steps want.
message ArtifactSource {
  // Path, relative to the checkout, of the file whose content the mill
  // attaches as the step's artifact. Rendered as a Go template over the run
  // — `docs/plans/{{.Date}}-{{.NodeSlug}}.md` — because a file named for the
  // run cannot be written down in a definition. The mill tells the session
  // the rendered path and reads the file back through the workspace when the
  // session ends.
  string path = 1;
}

// WorkflowMcpServer is one MCP server a workflow mounts on the steps that
// name it, in the same shape as the host's own `mcp-servers`
// (docs/tools.md §Configuration) but never global: a workflow cannot mount a
// server on every step of every project that runs it.
message WorkflowMcpServer {
  // The command to spawn.
  string command = 1;
  // Arguments to the command.
  repeated string args = 2;
  // Environment variables added for the spawned process, on top of the
  // session's own.
  map<string, string> env = 3;
}

// Workflow is a named, immutable, versioned definition of how a class of node
// gets worked. Data, not code. A workflow is never edited: a change is a new
// version, and runs in flight keep the version they started with.
message Workflow {
  // ULID.
  string id = 1;
  // quick-fix, feature, docs. Unique within a scope.
  string name = 2;
  // Content hash of the definition. Two definitions with the same hash are
  // the same version.
  string version = 3;
  // org or project. A project definition overrides an org one.
  Scope scope = 4;
  // The project, when the scope is project.
  string project = 5;
  // Ordered list of steps.
  repeated Step steps = 6;
  // Where this version came from: repo, commit, path — or a CLI push with
  // the pushing principal.
  Source source = 7;
  // When this version was stored.
  google.protobuf.Timestamp created_at = 8;
  // How a `status` step watches the forge's checks. Unset means the
  // documented defaults.
  StatusPolicy status = 9;
  // MCP servers this workflow's steps may mount, by name, with a step's
  // `mcp` option naming which. A name that collides with one the host's own
  // `mcp-servers` defines is refused at `mill workflow push`, naming the
  // collision.
  map<string, WorkflowMcpServer> mcp_servers = 10;
}

// StatusPolicy is how long a `status` step waits for the forge's checks to
// settle, and how often it asks. A pending status is not a failure: the step
// stays open and is verified again on the next tick until the checks settle
// or the cap elapses.
message StatusPolicy {
  // How often the forge is asked. Unset means one minute.
  google.protobuf.Duration interval = 1;
  // How long the step may keep asking before the run gives up. Unset means
  // one hour.
  google.protobuf.Duration timeout = 2;
}

// ProjectDefault is a project naming the workflow its nodes are worked
// through, and the tier that workflow stands for. Dagger nodes carry no
// workflow label; dagger never learns the word.
message ProjectDefault {
  // The dagger project.
  string project = 1;
  // Name, resolved to the newest version in scope at run creation.
  string workflow = 2;
  // What gate auto predicates compare against when the assessment did not
  // run.
  Tier tier = 3;
}

// StepToken is the credential ladder's bottom rung: issued by the store per
// step run, and the only credential a session ever holds. Every derived
// credential is minted by the workspace against a live step token and dies
// with it.
message StepToken {
  // ULID. From docs/ledger.md §step_tokens.
  string id = 1;
  // What it is scoped to.
  string step_run_id = 2;
  // Opaque bearer. Presented on the workspace socket. Returned by
  // IssueStepToken once and never again: the store keeps only `token_hash`.
  string token = 3;
  // SHA-256 of the bearer, which is all the store holds. From
  // docs/ledger.md §step_tokens.
  string token_hash = 4;
  // Copied from the step at issue.
  repeated Capability capabilities = 5;
  // When it was issued.
  google.protobuf.Timestamp issued_at = 6;
  // Revoked when the step run closes, whichever way.
  google.protobuf.Timestamp revoked_at = 7;
}

// Usage is what one turn cost, per model. One row per turn per model, as the
// adapter reports: a turn that bills two models writes two. Counts, never
// currency; a rate table is applied at query time.
message Usage {
  // The step run the cost is attributed to.
  string step_run_id = 1;
  // Free string naming the model.
  string model = 2;
  // Tokens sent to the model.
  int64 input_tokens = 3;
  // Tokens produced by the model.
  int64 output_tokens = 4;
  // Tokens served from the model's prompt cache.
  int64 cache_read_tokens = 5;
  // Tokens written to the model's prompt cache.
  int64 cache_write_tokens = 6;
  // When the turn was recorded.
  google.protobuf.Timestamp recorded_at = 7;
  // When this row's step totals were posted to dagger; unset until then.
  google.protobuf.Timestamp posted_at = 8;
  // Who counted it. Unset reads as the adapter's report.
  UsageSource source = 9;
}

// Workspace is what a step receives instead of a path and a keychain: a unix
// socket and a step token. One workspace per run; concurrent runs never share
// one.
message Workspace {
  // ULID.
  string id = 1;
  // The run it belongs to. Unique while live.
  string run_id = 2;
  // local today; container and remote later behind the same interface.
  WorkspaceKind kind = 3;
  // The git ref checked out at creation: the project's default branch, or
  // the run's branch on resume.
  string ref = 4;
  // The run's working branch, derived from the node ref.
  string branch = 5;
  // The unix socket a step's session reaches the workspace through.
  string socket = 6;
  // The step-scoped bearer for that socket. Rotated per step.
  string token = 7;
  // The effective capability set, from the current step.
  repeated Capability capabilities = 8;
  // Where it is. From docs/ledger.md §workspaces.
  string worker_ref = 9;
  // Whether its files still exist. From docs/ledger.md §workspaces.
  WorkspaceState state = 10;
  // When it was created. From docs/ledger.md §workspaces.
  google.protobuf.Timestamp created_at = 11;
  // When its files were destroyed. From docs/ledger.md §workspaces.
  google.protobuf.Timestamp destroyed_at = 12;
  // The machine behind a machine-backed workspace. Unset for a workspace
  // with no machine. From docs/ledger.md §workspaces.
  Sandbox sandbox = 13;
}

// Sandbox is what the ledger records of a run's machine, so that a
// reconciliation pass can tell an orphan from a live run, `mill inspect`
// can name it, and a proof can read from the record what the run booted
// and what it left in the cache (docs/sandbox.md §Reconciliation). The
// host's own copy is `runs/<id>/run.json`; the ledger's is the record.
message Sandbox {
  // The machine's name, `mill-<id>`: the reconciliation key.
  string machine = 1;
  // The host unit that owns it, `mill-machine@<id>.service`.
  string unit = 2;
  // The derived image digest the machine booted from.
  string image_digest = 3;
  // The host side of the machine's network link, as the host named it.
  string veth = 4;
  // The cache lineages restored into the run, and what each promoted.
  repeated SandboxLineage lineages = 5;
}

// SandboxLineage is one cache lineage a run restored a copy of, with the
// generation it restored and, once the run has finished, the generation it
// promoted (docs/sandbox.md §Caching).
message SandboxLineage {
  // The lineage's scope: `global` or `repo/<id>`.
  string scope = 1;
  // The lineage's name within its scope.
  string name = 2;
  // The generation the run's copy was restored from; 0 for a copy that
  // started empty.
  int64 restored = 3;
  // The generation the run promoted at finish: 0 for a reset. Unset until
  // the run has finished, and for a run whose copy was discarded.
  optional int64 promoted = 4;
}

// ModelTotals is one model's usage summed over some scope: a step run, a run.
message ModelTotals {
  // Free string naming the model.
  string model = 1;
  // Tokens sent to the model.
  int64 input_tokens = 2;
  // Tokens produced by the model.
  int64 output_tokens = 3;
  // Tokens served from the model's prompt cache.
  int64 cache_read_tokens = 4;
  // Tokens written to the model's prompt cache.
  int64 cache_write_tokens = 5;
  // Who counted the rows summed here. Unset reads as the adapter's report.
  UsageSource source = 6;
}

// RunSummary is a run with the things the ledger derives rather than stores,
// which is what `mill status` renders.
message RunSummary {
  // The run itself.
  Run run = 1;
  // The first step whose latest step run is not closed. Derived, never
  // stored: a column would drift.
  string current_step = 2;
  // Attempts used against the current step's retries.
  int64 current_attempt = 3;
  // The run's cost so far, summed over its step runs, by model.
  repeated ModelTotals totals = 4;
  // How many dagger leases the node has held under this run. Distinct from a
  // step's attempt.
  int64 leases = 5;
  // The run's workspace as the ledger recorded it: where it is, whether
  // its files still exist, and the machine behind it when there is one.
  // Unset for a run that has recorded none.
  Workspace workspace = 6;
}

// StepRunDetail is one attempt with everything hanging off it, which is what
// `mill inspect` renders.
message StepRunDetail {
  // The attempt.
  StepRun step_run = 1;
  // The evidence that closed it, if it closed.
  Evidence evidence = 2;
  // The session it ran in, for a skill step.
  Session session = 3;
  // What it cost, by model, as the adapter reported it: the rows posted to
  // dagger.
  repeated ModelTotals totals = 4;
  // How many times the harness asked this attempt's session about a
  // background task that had gone silent. A stalled attempt is one whose
  // heartbeats ran out, so the count is what says how the exit was reached
  // (docs/domain-model.md §Session).
  int64 heartbeats = 5;
  // What the credential gateway counted for the attempt, by model, from the
  // upstream's responses outside the session. Empty when no gateway sat in
  // front of it. Never posted to dagger: it is the check on `totals`, read
  // beside it (docs/sandbox.md §Credentials).
  repeated ModelTotals gateway_totals = 6;
}

// Event is one row of the ledger's audit trail: what changed about a run,
// when, and under which worker. Append-only, and written by the same
// transaction as the change it records. See docs/ledger.md §events.
message Event {
  // ULID, so time-ordered.
  string id = 1;
  // The run the change was about.
  string run_id = 2;
  // The attempt the change was about, when it was about one.
  string step_run_id = 3;
  // What happened, in the ledger's own words: `run_created`, `step_closed`,
  // `cancel_requested`.
  string op = 4;
  // The fields as they were, for the ones the change touched.
  google.protobuf.Struct before = 5;
  // The fields as they became.
  google.protobuf.Struct after = 6;
  // The worker that made the change, or the caller that asked for it.
  string worker_ref = 7;
  // When it happened.
  google.protobuf.Timestamp occurred_at = 8;
}

// CostBucket is one grouping of usage: everything billed under a key, by
// model, with the totals summed across them. What `mill cost` renders.
message CostBucket {
  // What the bucket groups by: a node reference, a workflow name and
  // version, a step name, a model, or a calendar day.
  string key = 1;
  // The bucket's usage, one entry per model.
  repeated ModelTotals totals = 2;
  // The step funnel, set only on a by_step bucket.
  StepCounts counts = 3;
}

// StepCounts is one step's funnel across the runs in a cost window: how many
// reached it, how many passed, how many died there, how many needed more
// than one attempt, how many revise rounds it answered, and how many
// attempts it saw. Derived from step_runs rather than usage, so a check or
// gate step with no billed tokens still has a funnel.
message StepCounts {
  // Runs with at least one attempt of the step.
  int64 reached = 1;
  // Runs with a closed attempt of the step.
  int64 passed = 2;
  // Runs whose last-started step run, by started_at, is this step, and
  // whose run status is failed or abandoned.
  int64 died = 3;
  // Runs with more than one attempt of the step.
  int64 retried = 4;
  // Step runs elsewhere in the window whose feedback_from names an attempt
  // of this step: the revise rounds this step's verdicts opened.
  int64 revises = 5;
  // Every attempt of the step, across every run.
  int64 attempts = 6;
}

// TimeBucket says how `mill cost` groups a window's usage over time, beside
// the run, workflow, step and model groupings it always computes.
enum TimeBucket {
  // TIME_BUCKET_UNSPECIFIED is the zero value: no time grouping, CostResponse
  // carries no by_day.
  TIME_BUCKET_UNSPECIFIED = 0;
  // TIME_BUCKET_DAY groups by UTC calendar day.
  TIME_BUCKET_DAY = 1;
}

// The activity record: what happened inside an attempt, kept whole.
// docs/activity.md is its specification; this is the wire shape it defines.

// ActivitySource says who produced one Activity record.
enum ActivitySource {
  // ACTIVITY_SOURCE_UNSPECIFIED is the zero value and carries no meaning.
  ACTIVITY_SOURCE_UNSPECIFIED = 0;
  // ACTIVITY_SOURCE_HARNESS means the record came from the sidecar's own
  // event stream: the session's text, tool calls, usage.
  ACTIVITY_SOURCE_HARNESS = 1;
  // ACTIVITY_SOURCE_WORKSPACE means the record came from a verb the
  // workspace ran on the step's behalf: a commit, a push, a PR.
  ACTIVITY_SOURCE_WORKSPACE = 2;
  // ACTIVITY_SOURCE_CHECK means the record came from a check step's command.
  ACTIVITY_SOURCE_CHECK = 3;
  // ACTIVITY_SOURCE_MILL means the mill wrote the record itself: the
  // prompt, a gate filed, an attempt's boundary.
  ACTIVITY_SOURCE_MILL = 4;
}

// Prompt is the rendered prompt handed to a session, whole.
message Prompt {
  // The prompt's full text.
  string text = 1;
}

// Text is something the assistant said, whole or as a delta of one block.
message Text {
  // Identifies the content block a delta belongs to, so deltas of one
  // block can be told apart and coalesced.
  string block_id = 1;
  // The text, or the delta's fragment when `delta` is set.
  string text = 2;
  // Whether this is a partial fragment of the block rather than the whole
  // of it.
  bool delta = 3;
  // Whether this is the block's last delta.
  bool final = 4;
}

// Thinking is the model's reasoning, shaped exactly as Text.
message Thinking {
  // Identifies the content block a delta belongs to, so deltas of one
  // block can be told apart and coalesced.
  string block_id = 1;
  // The text, or the delta's fragment when `delta` is set.
  string text = 2;
  // Whether this is a partial fragment of the block rather than the whole
  // of it.
  bool delta = 3;
  // Whether this is the block's last delta.
  bool final = 4;
}

// ToolCall is the session asking to use a tool.
message ToolCall {
  // Matches the ToolResult that answers it.
  string call_id = 1;
  // The tool's name, as the harness names it.
  string name = 2;
  // The call's arguments, kept whole (docs/activity.md, unlike today's
  // summary line).
  google.protobuf.Struct arguments = 3;
}

// ToolResult is what a tool returned, kept whole.
message ToolResult {
  // The ToolCall this answers.
  string call_id = 1;
  // The result, rendered as text.
  string content = 2;
  // Whether the tool failed.
  bool is_error = 3;
}

// VerbStarted marks the beginning of a workspace verb: a commit, a push, a
// PR request.
message VerbStarted {
  // The verb's name, such as `git.commit` or `git.push`.
  string name = 1;
  // The verb's arguments, mill's own and never a session's free text.
  map<string, string> arguments = 2;
}

// Output is one chunk of a stream, produced by a verb or a check as it ran.
// Shared by `verb_output` and `check_output`.
message Output {
  // The stream's name: `stdout`, `stderr`, or a verb's own key.
  string stream = 1;
  // The chunk. Whole lines only; a trailing partial line is held back by
  // the writer until it completes (docs/activity.md §Redaction).
  bytes data = 2;
}

// Verb is the outcome of a workspace verb that has finished.
message Verb {
  // The verb's name, matching its VerbStarted.
  string name = 1;
  // What the verb returned, when it succeeded.
  string result = 2;
  // What the verb failed with, when it did not.
  string error = 3;
}

// CheckStarted marks the beginning of a check step's command.
message CheckStarted {
  // The resolved command, as it was run.
  repeated string command = 1;
  // The check's contract: exit codes, stdout shape, feedback policy.
  Check contract = 2;
}

// CheckResult is the outcome of a check step's command. Named apart from
// the existing `Check` message, which is the step's contract rather than
// one run's result.
message CheckResult {
  // How the command exited.
  harness.v1.ProcessExit exit = 1;
  // Why it failed, when it did.
  string reason = 2;
}

// HarnessStderr is the sidecar's own standard error, kept on a refusal or a
// crash: the only place the process's own diagnostics survive.
message HarnessStderr {
  // The sidecar process's standard error, whole.
  string text = 1;
}

// GateFiled records a gate step's filing: the ledger's `gate_node_id`,
// alongside the ask it was filed with.
message GateFiled {
  // What the gate decides: plan, merge, park, probe (internal/notify.Kind).
  string kind = 1;
  // The filed gate node's id.
  string node_id = 2;
  // The filed gate node's reference.
  string node_ref = 3;
  // The gate's rendered title.
  string title = 4;
}

// AttemptStarted is always an attempt's first record, seq 1, so a frame
// reads alone: it carries the fold's own label.
message AttemptStarted {
  // The step this attempt is of.
  string step = 1;
  // The attempt number.
  int64 attempt = 2;
  // skill, check, gate, or preparatory.
  StepKind kind = 3;
  // Skill steps only: the session this attempt ran in.
  string session_id = 4;
  // Skill steps only: the session's name, from the step definition.
  string session_name = 5;
  // Skill steps only: the skill this attempt ran.
  string skill_name = 6;
  // Skill steps only: the skill's content digest.
  string skill_digest = 7;
  // Skill steps only: the harness adapter this attempt ran under.
  string harness = 8;
  // Skill steps only: the harness options document the step carried.
  google.protobuf.Struct options = 9;
}

// AttemptEnded is always an attempt's last record, so a frame's outcome is
// never inferred from what came before it.
message AttemptEnded {
  // Closed, failed, or aborted.
  StepRunStatus status = 1;
  // What closed the attempt, when it closed.
  EvidenceKind evidence_kind = 2;
  // Written to read alone as the stream's last line: `verdict: revise, 2
  // blocking`, `exit status 1`, `gate denied`.
  string reason = 3;
}

// Activity is one event inside an attempt. The worker assigns seq, turn and
// at as the event arrives; the body is the harness's, the workspace's, the
// check's or the mill's own, redacted before it is written.
// docs/activity.md is the specification this message implements.
message Activity {
  // The attempt this record belongs to.
  string step_run_id = 1;
  // 1-based within the attempt. The order of the record, the cursor a
  // reader resumes from, and the tie-breaker when runs interleave.
  int64 seq = 2;
  // When the record was written.
  google.protobuf.Timestamp at = 3;
  // For a record that spans time — a coalesced text block, a check, a
  // verb — when it ended. Unset for an instant.
  google.protobuf.Timestamp ended_at = 4;
  // Who produced it.
  ActivitySource source = 5;
  // 1-based within the attempt: the model turn the record belongs to
  // (docs/activity.md §Turns). 0 on a check step's records and the mill's
  // own.
  int64 turn = 6;
  // Set when the event happened inside a subagent: the tool call in the
  // parent session that started it. Folds nest on this.
  string parent_call_id = 7;
  // The body's size before any cap, and whether the stored body is cut. A
  // cap is visible, never silent.
  int64 bytes = 8;
  // Whether the body was cut down after crossing the attempt's ceiling.
  bool truncated = 9;
  // Exactly one of the kinds docs/activity.md's table names.
  oneof body {
    // The prompt handed to the session.
    Prompt prompt = 10;
    // Something the assistant said.
    Text text = 11;
    // The model's reasoning.
    Thinking thinking = 12;
    // The session asking to use a tool.
    ToolCall tool_call = 13;
    // A tool's answer.
    ToolResult tool_result = 14;
    // What a turn cost, per model.
    harness.v1.Usage usage = 15;
    // The sidecar asked a silent session whether its task is still needed.
    harness.v1.Heartbeat heartbeat = 16;
    // A workspace verb began.
    VerbStarted verb_started = 17;
    // One chunk of a verb's stream.
    Output verb_output = 18;
    // A workspace verb finished.
    Verb verb = 19;
    // A check step's command began.
    CheckStarted check_started = 20;
    // One chunk of a check's stream.
    Output check_output = 21;
    // A check step's command finished.
    CheckResult check = 22;
    // The sidecar's own standard error, on a refusal or a crash.
    HarnessStderr harness_stderr = 23;
    // A gate step filed its gate.
    GateFiled gate_filed = 24;
    // The attempt began.
    AttemptStarted attempt_started = 25;
    // The attempt ended.
    AttemptEnded attempt_ended = 26;
  }
}

// ActivityIndexRow is one sealed record's row in the `activity` table
// (docs/activity.md §The index row): everything a query needs to find and
// page a record by, and none of its body. `Logs` reads bodies back from the
// frame at `offset`.
message ActivityIndexRow {
  // The attempt this record belongs to.
  string step_run_id = 1;
  // The record's position in the sealed frame, after coalescing.
  int64 seq = 2;
  // When the record was written.
  google.protobuf.Timestamp at = 3;
  // Set for a record that spans time.
  google.protobuf.Timestamp ended_at = 4;
  // The oneof field name of the record's body, e.g. "tool_call".
  string kind = 5;
  // Who produced it.
  ActivitySource source = 6;
  // The model turn the record belongs to.
  int64 turn = 7;
  // Set on a tool_call or tool_result: the call it names.
  string call_id = 8;
  // Set when the event happened inside a subagent.
  string parent_call_id = 9;
  // Set on a tool_call: the tool's name.
  string tool = 10;
  // The body's size before any cap.
  int64 bytes = 11;
  // Whether the body was cut down after crossing the attempt's ceiling.
  bool truncated = 12;
  // The record's byte position in the uncompressed frame.
  int64 offset = 13;
}
